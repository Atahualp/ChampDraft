/* ---------- 7b. HEAD-TO-HEAD SHEET ----------------------------- */
function openCompareSheet(idA,idB){
  const c=comparePlayers(idA,idB); if(!c) return;
  const {a,b,pa,pb,env}=c;
  const drafted=draftedIds(), goneA=drafted.has(a.id), goneB=drafted.has(b.id);
  const d=Math.round(pa.score-pb.score);
  const fmt=v=>v==null?'—':v;
  /* one row of the grid, better value highlighted; lowBetter for ranks */
  const row=(k,va,vb,lowBetter,fmtFn)=>{
    fmtFn=fmtFn||(x=>x==null?'—':x);
    let wa='',wb='';
    if(va!=null&&vb!=null&&va!==vb){
      const aWins=lowBetter?va<vb:va>vb;
      wa=aWins?' win':''; wb=aWins?'':' win';
    }
    return `<div class="k">${k}</div><div class="num${wa}">${fmtFn(va)}</div><div class="num${wb}">${fmtFn(vb)}</div>`;
  };
  let verdict;
  if(goneA||goneB){
    verdict=`${esc((goneA?a:b).n)} is already drafted — no plan to weigh.`;
  }else if(Math.abs(d)<4){
    verdict=`<strong>Coin flip.</strong> The two plans land within ${Math.max(1,Math.abs(d))} points of each other through your next pick. Take the one you believe in.`;
  }else{
    const w=d>0?a:b, l=d>0?b:a, lp=d>0?pb:pa;
    verdict=`Take <strong>${esc(w.n)}</strong> first — that plan projects <strong>+${Math.abs(d)} points</strong> through your next pick`;
    if(!drafted.has(l.id)&&lp.surv>=0.55) verdict+=`, and ${esc(l.n)} is ${Math.round(lp.surv*100)}% to still be there`;
    verdict+='.';
  }
  let h=`<div class="grab"></div>
    <h3>Head to head</h3>
    <div class="verdict">${verdict}</div>
    <div class="cmpgrid">
      <div></div>
      <div class="hd">${esc(a.n)}<br><span class="sub">${a.p}${posRankMap[a.id]||''} · ${esc(a.t)||'FA'}</span></div>
      <div class="hd">${esc(b.n)}<br><span class="sub">${b.p}${posRankMap[b.id]||''} · ${esc(b.t)||'FA'}</span></div>
      ${row('Plan',Math.round(pa.score),Math.round(pb.score),false)}
      ${row('VORP',Math.round(a.vorp),Math.round(b.vorp),false)}
      ${row('Points',Math.round(a.pts.total),Math.round(b.pts.total),false)}
      ${row('Our board',a.ovr,b.ovr,true)}
      ${row(esc(META.rank1),a.r1,b.r1,true)}
      ${row(esc(META.rank2),a.r2,b.r2,true)}
      ${row(esc(META.rank3),a.r3,b.r3,true)}
      ${row('ADP',a.a!=null?Math.round(a.a):null,b.a!=null?Math.round(b.a):null,true)}
      ${row('Survives',goneA?null:Math.round(pa.surv*100),goneB?null:Math.round(pb.surv*100),false,v=>v==null?'—':v+'%')}
      ${row('Bye',a.b||null,b.b||null,false,v=>v==null?'—':v)}
    </div>
    <div class="hint">Plan = points he adds now, plus the expected best pick still available at your next turn if you take him — the same math behind the suggestions.</div>`;
  if((a.p==='TE'||b.p==='TE')&&env.cnt.TE>=1)
    h+=`<div class="hint">You already carry a tight end — the engine would not spend this pick on another. Stream the position instead.</div>`;
  h+=`<button class="act" data-c="${a.id}">Open ${esc(a.n)}</button>
      <button class="act" data-c="${b.id}">Open ${esc(b.n)}</button>`;
  $('#sheet').innerHTML=h;
  $('#sheet').querySelectorAll('[data-c]').forEach(bt=>bt.onclick=()=>openSheet(bt.dataset.c));
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}

async function doPick(playerId,teamIdx,manualName){
  const n=nextPickNumber();
  if(n>totalPicks()) return;
  if(S.picks.some(p=>p.pickNumber===n)) return;   // FIX: dedupe was defined but never wired
  const pick={pickNumber:n,round:roundOf(n),teamIdx,playerId:playerId||null,
    manualName:manualName||null,timestamp:Date.now()};
  if(playerId&&S.picks.some(p=>p.playerId===playerId)) return;  // FIX: no double-drafting
  S.picks.push(pick);
  await storage.saveSession(S);
  closeSheet(); render();
  // auto-sim armed and that was your pick? carry on without asking
  if(ui.auto&&teamIdx===S.myTeamIdx&&nextPickNumber()<=totalPicks())
    setTimeout(runSim,450);
}
async function undoLast(){
  ui.auto=false; setSimLabel();
  if(!S.picks.length) return;
  S.picks.pop(); await storage.saveSession(S); render();
}
/* Pick order IS the state: picks[j] belongs to whoever the snake gives pick j+1.
   Removing a pick from the middle would shift every later pick into a different
   team's slot while it kept its old teamIdx, which silently corrupted the board.
   Undoing a drafted player therefore REWINDS to just before he was taken. */
async function undoPlayer(id){
  const i=S.picks.findIndex(p=>p.playerId===id);
  if(i<0) return;
  ui.auto=false; setSimLabel();
  S.picks.splice(i);
  await storage.saveSession(S); closeSheet(); render();
}
const save=()=>storage.saveSession(S);

/* ---------- 8. MOCK DRAFT ------------------------------------- */
let simming=false;
function setSimLabel(){
  const b=$('#simBtn'); if(!b) return;
  b.textContent=ui.auto?'■ Auto-sim on':'▶ Auto-sim';
  b.setAttribute('aria-pressed',ui.auto?'true':'false');
}
function toggleSim(){
  ui.auto=!ui.auto; setSimLabel();
  if(ui.auto) runSim();
}
async function runSim(){
  if(simming) return;
  simming=true;
  while(ui.auto){
    const n=nextPickNumber();
    if(n>totalPicks()){ui.auto=false;break;}
    if(teamOnPick(n)===S.myTeamIdx) break;     // your clock — hold, stay armed
    const idx=teamOnPick(n), p=botPick(idx);
    if(!p){ui.auto=false;break;}
    await doPick(p.id,idx);
    await new Promise(r=>setTimeout(r,500));
  }
  simming=false; setSimLabel(); render();
}

const flexOk=p=>['RB','WR','TE'].includes(p);
/* ---------- 8b. POST-DRAFT GRADES & RECAP ---------------------
   Everything here is computed locally from the same projections the
   board uses. Grades are RELATIVE to the other teams in this draft,
   because that is what actually decides a head-to-head season. */
function optimalLineup(idx){
  const r=rosterOf(idx).map(p=>byId(p.playerId)).filter(Boolean);
  const used=new Set(), starters=[];
  POSITIONS.forEach(pos=>{
    r.filter(x=>x.p===pos&&!used.has(x.id))
     .sort((a,b)=>b.pts.total-a.pts.total)
     .slice(0,S.rosterSlots[pos]||0)
     .forEach(x=>{starters.push({slot:pos,pl:x});used.add(x.id);});
  });
  for(let i=0;i<(S.rosterSlots.FLEX||0);i++){
    const f=r.filter(x=>flexOk(x.p)&&!used.has(x.id))
             .sort((a,b)=>b.pts.total-a.pts.total)[0];
    if(f){starters.push({slot:'FLEX',pl:f});used.add(f.id);}
  }
  const bench=r.filter(x=>!used.has(x.id)).sort((a,b)=>b.pts.total-a.pts.total);
  return {starters,bench,pts:starters.reduce((a,x)=>a+x.pl.pts.total,0)};
}
function leagueGrades(){
  const rows=[];
  for(let i=0;i<S.numTeams;i++) rows.push({idx:i,...optimalLineup(i)});
  [...rows].sort((a,b)=>b.pts-a.pts).forEach((r,i)=>r.rank=i+1);
  const n=Math.max(2,S.numTeams);
  rows.forEach(r=>{
    const q=(r.rank-1)/(n-1);
    r.grade=q<=0.05?'A+':q<=0.16?'A':q<=0.27?'A-':q<=0.41?'B+':q<=0.57?'B'
           :q<=0.69?'B-':q<=0.80?'C+':q<=0.90?'C':q<=0.97?'C-':'D';
  });
  return rows;
}
/* strongest and weakest position groups relative to the rest of the league */
function positionalEdge(idx,rows){
  const grp={};
  POSITIONS.forEach(pos=>{
    const mine=rows[idx].starters.filter(s=>s.pl.p===pos).reduce((a,s)=>a+s.pl.pts.total,0);
    const others=rows.filter(r=>r.idx!==idx)
      .map(r=>r.starters.filter(s=>s.pl.p===pos).reduce((a,s)=>a+s.pl.pts.total,0));
    const avg=others.length?others.reduce((a,b)=>a+b,0)/others.length:0;
    if(mine||avg) grp[pos]={mine,avg,diff:mine-avg};
  });
  return grp;
}
/* Draft-day value, judged against OUR league-scored board rather than the
   room's ADP — the market prices half-PPR, this league does not.

   STEALS use board fall (pick number minus board rank). That comparison is
   self-limiting and stays honest: to fall 10 picks past board rank you have to
   BE a top-N player still sitting there, which cannot happen once the board is
   picked over.

   REACHES cannot use the same yardstick, and used to. By pick 135 every player
   ranked inside the top 135 is gone, so pick-minus-rank is guaranteed to come
   back hugely negative no matter who you take — the metric was really just
   measuring how deep into the draft you were and calling it your fault. It
   labelled a pick at 135 as "107 early" when the rest of the room was taking
   players of identical board rank on either side of it.

   A reach is now what the words actually mean: better players were sitting
   right there and you passed them. Count them at the moment of the pick. */
function pickValue(idx){
  const all=[...S.picks].sort((a,b)=>a.pickNumber-b.pickNumber);
  const skill=scored.filter(p=>p.p!=='K'&&p.p!=='DST');
  const taken=new Set();
  const cnt={}; POSITIONS.forEach(p=>cnt[p]=0);
  const out=[];
  for(const pk of all){
    const pl=byId(pk.playerId);
    if(pk.teamIdx===idx&&pl&&pl.p!=='K'&&pl.p!=='DST'){
      /* Value each alternative the way the engine would have, for the roster I
         actually held at that moment — raw VORP counted players my own board
         would never have taken (a fifth receiver, a third quarterback) and so
         manufactured reaches out of reasonable picks. */
      const mine=valueFor(pl,cnt[pl.p]||0);
      let better=0, best=null, bestV=-Infinity;
      for(const q of skill){
        if(taken.has(q.id)||q.id===pl.id) continue;
        if(q.p==='TE'&&(cnt.TE||0)>=1) continue;      // engine would never take one
        const v=valueFor(q,cnt[q.p]||0);
        if(v>mine){ better++; if(v>bestV){bestV=v;best=q;} }
      }
      out.push({pl,pick:pk.pickNumber,
        delta:Math.round(pk.pickNumber-pl.ovr),      // board fall, for steals
        better,                                       // better men left, for reaches
        gap:bestV>-Infinity?bestV-mine:0,             // how much better the best one was
        bestVal:bestV>-Infinity?bestV:0,
        best,
        adp:pl.a!=null?Math.round(pk.pickNumber-pl.a):null});
    }
    if(pl){ taken.add(pl.id); if(pk.teamIdx===idx) cnt[pl.p]=(cnt[pl.p]||0)+1; }
  }
  return out.sort((a,b)=>b.delta-a.delta);
}
/* if a starter goes down, how far does the roster fall at that position? */
/* If a starter goes down, how far does the roster fall at that position?
   With no backup the old answer was his ENTIRE projection — as if you would
   field an empty slot for the rest of the year. You would not; you would stream
   the position, which is what waiverPts measures. Losing a 143-point tight end
   with nobody behind him costs the gap to a waiver tight end, not 143 points. */
function fragility(idx,L){
  const out=[];
  POSITIONS.forEach(pos=>{
    if(pos==='K'||pos==='DST') return;
    const st=L.starters.filter(s=>s.pl.p===pos).map(s=>s.pl);
    if(!st.length) return;
    const worst=st[st.length-1];
    const next=L.bench.filter(b=>b.p===pos)[0];
    const fallback=Math.max(next?next.pts.total:0, waiverPts[pos]||0);
    out.push({pos,drop:Math.round(Math.max(0,worst.pts.total-fallback)),
              hasCover:!!next,
              streamed:!next||(waiverPts[pos]||0)>(next?next.pts.total:0)});
  });
  return out.sort((a,b)=>b.drop-a.drop);
}
function byeTrouble(L){
  const w={};
  L.starters.forEach(s=>{if(s.pl.b) (w[s.pl.b]=w[s.pl.b]||[]).push(s.pl.n);});
  return Object.entries(w).filter(([,v])=>v.length>=3)
    .map(([week,v])=>({week:+week,names:v}));
}
/* Weekly scoring across the fantasy regular season. A season total hides bye
   damage completely — this fills each week's lineup from whoever is actually
   playing, so a week with three starters off shows up as the dip it is. */
const REG_FROM=1, REG_TO=13;
function weeklyScores(idx,from,to){
  from=from||REG_FROM; to=to||REG_TO;
  const G=S.scoring.games||17;
  const r=rosterOf(idx).map(p=>byId(p.playerId)).filter(Boolean);
  const out=[];
  for(let w=from;w<=to;w++){
    const pool=r.filter(p=>p.b!==w);
    const used=new Set(); let pts=0; const gaps=[];
    POSITIONS.forEach(pos=>{
      const need=S.rosterSlots[pos]||0;
      const got=pool.filter(x=>x.p===pos&&!used.has(x.id))
                    .sort((a,b)=>b.pts.total-a.pts.total).slice(0,need);
      got.forEach(x=>{used.add(x.id);pts+=x.pts.total/G;});
      for(let k=got.length;k<need;k++) gaps.push(pos);
    });
    for(let i=0;i<(S.rosterSlots.FLEX||0);i++){
      const f=pool.filter(x=>flexOk(x.p)&&!used.has(x.id))
                  .sort((a,b)=>b.pts.total-a.pts.total)[0];
      if(f){used.add(f.id);pts+=f.pts.total/G;} else gaps.push('FLEX');
    }
    out.push({week:w,pts,holes:gaps.length,gaps});
  }
  return out;
}
function weeklySummary(idx){
  const w=weeklyScores(idx);
  const vals=w.map(x=>x.pts);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const lo=w.reduce((a,b)=>b.pts<a.pts?b:a), hi=w.reduce((a,b)=>b.pts>a.pts?b:a);
  return {weeks:w,mean,total:vals.reduce((a,b)=>a+b,0),lo,hi,
          holes:w.reduce((a,b)=>a+b.holes,0)};
}

function renderRecap(){
  const rows=leagueGrades(), me=rows[S.myTeamIdx];
  const done=S.picks.length>=totalPicks();
  const edge=positionalEdge(S.myTeamIdx,rows);
  const vals=pickValue(S.myTeamIdx);
  const frag=fragility(S.myTeamIdx,me);
  const byes=byeTrouble(me);
  const lg=rows.map(r=>r.pts), avg=lg.reduce((a,b)=>a+b,0)/lg.length;
  const best=Object.entries(edge).filter(([p])=>p!=='K'&&p!=='DST')
    .sort((a,b)=>b[1].diff-a[1].diff);
  let h=`<div class="card"><h3>${done?'Draft grade':'Grade so far'}</h3>
    <div class="gradewrap">
      <div class="gradebig">${me.grade}</div>
      <div><div class="num" style="font-size:20px;font-weight:700">${me.pts.toFixed(0)} pts</div>
      <div class="sub2" style="margin:0">projected starting lineup · ${me.rank}${['th','st','nd','rd'][me.rank%10<4&&Math.floor(me.rank/10)!==1?me.rank%10:0]} of ${S.numTeams}
      · ${me.pts>avg?'+':''}${(me.pts-avg).toFixed(0)} vs league average</div></div>
    </div>`;
  if(!done) h+=`<div class="hint">Draft isn't finished — this updates as picks come in.</div>`;
  h+=`</div>`;

  const wk=weeklySummary(S.myTeamIdx);
  const wkAll=rows.map(r=>weeklySummary(r.idx).mean);
  const wkAvg=wkAll.reduce((a,b)=>a+b,0)/wkAll.length;
  const wkRank=wkAll.filter(v=>v>wk.mean).length+1;
  const wkMax=Math.max(...wk.weeks.map(x=>x.pts))||1;
  h+=`<div class="card"><h3>Weeks 1–13</h3>
    <div class="gradewrap">
      <div><div class="num" style="font-size:28px;font-weight:800;letter-spacing:-.03em">${wk.mean.toFixed(1)}</div>
      <div class="eyebrow">pts per week</div></div>
      <div class="sub2" style="margin:0">${wk.total.toFixed(0)} total over 13 weeks<br>
      ${wk.mean>wkAvg?'+':''}${(wk.mean-wkAvg).toFixed(1)} vs league average · ${wkRank} of ${S.numTeams}</div>
    </div>
    <div class="byestrip" style="margin-top:10px">`+
    wk.weeks.map(x=>`<div class="byecol">
      <div class="byebar ${x.holes?'bad':x.pts<wk.mean*0.93?'warn2':''}"
           style="height:${8+(x.pts/wkMax)*40}px"></div>
      <div class="byewk num">${x.week}</div></div>`).join('')+
    `</div>
    <div class="hint">Worst week is ${wk.lo.week} at ${wk.lo.pts.toFixed(1)}
      (${(wk.hi.pts-wk.lo.pts).toFixed(1)} below your best).
      ${wk.holes?`<span class="warn" style="display:block;margin-top:4px">Empty slots on bye: ${
        wk.weeks.filter(x=>x.gaps.length).map(x=>`week ${x.week} (no ${[...new Set(x.gaps)].join(', ')})`).join(', ')
        }. You'll be streaming from waivers those weeks.</span>`:'Every slot is covered on every bye week.'}
      Assumes each player's projection spread evenly across ${S.scoring.games||17} games.</div>
  </div>`;

  const ORDER={QB:0,RB:1,WR:2,TE:3,FLEX:4,K:5,DST:6};
  h+=`<div class="card"><h3>Your starting lineup</h3>`;
  [...me.starters].sort((a,b)=>ORDER[a.slot]-ORDER[b.slot]).forEach(st=>
    h+=`<div class="slot"><span><span class="badge b-${st.pl.p}" style="display:inline-grid;vertical-align:-5px;margin-right:8px">${st.slot==='FLEX'?'FLX':st.pl.p}</span>${esc(st.pl.n)}
      ${st.pl.b?`<span class="sub">bye ${st.pl.b}</span>`:''}</span>
      <span class="num">${st.pl.pts.total.toFixed(0)}</span></div>`);
  h+=`</div>`;

  /* BENCH. A flat list of names hid what each body is actually for — cover for
     a starter's bye, insurance behind one of your own backs, or a pure swing.
     Each row now says which, and whether he plugs a bye you would otherwise be
     streaming. */
  if(me.bench.length){
    const starters=me.starters.map(s=>s.pl);
    const byeGaps={};                                    // week -> positions uncovered
    wk.weeks.filter(x=>x.gaps.length).forEach(x=>byeGaps[x.week]=new Set(x.gaps));
    const myRBTeams=new Set(starters.filter(p=>p.p==='RB'&&p.t).map(p=>p.t));
    const cntStart={}; POSITIONS.forEach(p=>cntStart[p]=starters.filter(x=>x.p===p).length);
    h+=`<div class="card"><h3>Your bench</h3>`;
    [...me.bench].sort((a,b)=>b.pts.total-a.pts.total).forEach(b=>{
      const tags=[];
      const coversWeek=Object.keys(byeGaps).find(w=>
        byeGaps[w].has(b.p==='RB'||b.p==='WR'||b.p==='TE'?'FLEX':b.p)||byeGaps[w].has(b.p));
      const sameByeAsStarter=starters.some(s=>s.p===b.p&&s.b&&s.b===b.b);
      if(b.p==='RB'&&b.t&&myRBTeams.has(b.t)) tags.push('<span class="tag hc">handcuff</span>');
      if(coversWeek&&b.b!=+coversWeek) tags.push(`<span class="tag ok">plugs week ${coversWeek}</span>`);
      else if(sameByeAsStarter) tags.push(`<span class="tag bad">same bye as your starter</span>`);
      const starterAtPos=starters.filter(s=>s.p===b.p).sort((x,y)=>x.pts.total-y.pts.total)[0];
      if(starterAtPos&&b.pts.total>starterAtPos.pts.total)
        tags.push('<span class="tag ok">outprojects a starter</span>');
      if(!tags.length) tags.push('<span class="tag">depth</span>');
      h+=`<div class="slot"><span><span class="badge b-${b.p}" style="display:inline-grid;vertical-align:-5px;margin-right:8px">${b.p}</span>${esc(b.n)}
        ${b.b?`<span class="sub">bye ${b.b}</span>`:''}<span class="tags">${tags.join('')}</span></span>
        <span class="num">${b.pts.total.toFixed(0)}</span></div>`;
    });
    const uncovered=Object.keys(byeGaps);
    h+=`<div class="hint">${uncovered.length
      ? `Weeks ${uncovered.join(', ')} still have an empty slot no bench player can fill — those are waiver weeks.`
      : `Every bye week is covered from your own bench.`}</div></div>`;
  }

  h+=`<div class="card"><h3>Where you stand</h3>`;
  if(best.length){
    const s=best[0], w=best[best.length-1];
    h+=`<div class="slot"><span><strong>${s[0]}</strong> is your strength</span>
      <span class="num up">${s[1].diff>0?'+':''}${s[1].diff.toFixed(0)}</span></div>`;
    h+=`<div class="slot"><span><strong>${w[0]}</strong> is your weak spot</span>
      <span class="num ${w[1].diff>=0?'up':'down'}">${w[1].diff>0?'+':''}${w[1].diff.toFixed(0)}</span></div>`;
  }
  h+=`<div class="hint">Points above or below what the other ${S.numTeams-1} teams average at that position.</div></div>`;

  if(vals.length){
    const steals=vals.filter(v=>v.delta>=10&&v.pl.vorp>0).slice(0,3);
    /* A reach needs BOTH: a crowd of better men left, and one of them better by
       more than two credible projection sets would disagree. The count alone
       flagged last-round picks, where a dozen interchangeable bodies always
       remain and nothing is at stake. */
    /* A reach needs all three: a crowd of better men left, one of them better by
       more than two credible projection sets would disagree, AND that man
       actually worth something to this roster. Without the last test the final
       round flagged as a reach because a spare quarterback graded above a sixth
       running back — true, and worth nothing to either of them. */
    const reaches=vals.filter(v=>v.better>=REACH_MIN&&v.gap>=TIE_BAND&&v.bestVal>0)
      .sort((a,b)=>b.gap-a.gap).slice(0,2);
    h+=`<div class="card"><h3>Draft-day value</h3>`;
    if(steals.length){ steals.forEach(v=>h+=`<div class="slot"><span>${esc(v.pl.n)}
      <span class="sub">pick ${v.pick}</span></span><span class="num steal">${v.delta} past our board${v.adp!=null&&v.adp>=8?` · ${v.adp} past ADP`:''}</span></div>`); }
    else h+=`<div class="sub2">No picks landed more than 10 spots past where this league's scoring values them.</div>`;
    if(reaches.length){ reaches.forEach(v=>h+=`<div class="slot"><span>${esc(v.pl.n)}
      <span class="sub">pick ${v.pick}${v.best?` · ${esc(v.best.n)} was there`:''}</span></span>
      <span class="num down">${v.better} better available</span></div>`); }
    else h+=`<div class="sub2">No pick passed over a crowd of clearly better players.</div>`;
    h+=`</div>`;
  }

  if(frag.length){
    const worst=frag[0];
    h+=`<div class="card"><h3>If someone gets hurt</h3>`;
    frag.slice(0,3).forEach(f=>h+=`<div class="slot"><span>${f.pos}${f.streamed?' <span class="sub">would stream</span>':''}</span>
      <span class="num ${f.drop>60?'down':''}">−${f.drop} pts</span></div>`);
    h+=`<div class="hint">Drop from your weakest starter to the best replacement you could actually field —
      your bench, or the waiver wire when that is better.
      ${worst.drop>60?`${worst.pos} is the position you can least afford to lose.`:''}</div></div>`;
  }

  if(byes.length){
    h+=`<div class="card"><h3>Bye weeks</h3>`;
    byes.forEach(b=>h+=`<div class="warn" style="margin:0 0 6px">Week ${b.week}: ${b.names.length} starters out
      — ${esc(b.names.slice(0,4).join(', '))}</div>`);
    h+=`<div class="hint">You'll need waiver help those weeks.</div></div>`;
  }

  h+=`<div class="card"><h3>League table</h3>`;
  [...rows].sort((a,b)=>a.rank-b.rank).forEach(r=>
    h+=`<div class="slot"><span><span class="idx num" style="margin-right:8px">${r.rank}</span>
      ${esc(teamName(r.idx))}${r.idx===S.myTeamIdx?' <span class="pill pilllive">you</span>':''}</span>
      <span><span class="num">${r.pts.toFixed(0)}</span> <span class="gradesm">${r.grade}</span></span></div>`);
  h+=`<button class="act" id="expBtn">Copy draft results</button>`;
  h+=`<div class="hint">Grades are relative to this league, not an absolute scale — someone always finishes last.
    Built on ${esc(META.proj)}, so treat them as a starting point, not a verdict.
    Kicker and defense totals are incomplete (no field-goal distance splits or per-game defensive brackets).</div></div>`;
  return h;
}

/* ---------- 8c. WATCHLIST, FLAGS, GRID, BYES, EXPORT ----------- */
const isWatched=id=>(S.watch||[]).includes(id);
function toggleWatch(id){
  if(!S.watch) S.watch=[];
  const i=S.watch.indexOf(id);
  i>=0?S.watch.splice(i,1):S.watch.push(id);
  save();
}
/* Bye load across your projected starters, so you catch a pileup in
   round 8 rather than reading about it in the recap. */
function byeLoad(){
  const L=optimalLineup(S.myTeamIdx), c={};
  L.starters.forEach(s=>{if(s.pl.b) c[s.pl.b]=(c[s.pl.b]||0)+1;});
  const weeks=Object.keys(c).map(Number);
  const lo=weeks.length?Math.min(5,...weeks):5, hi=weeks.length?Math.max(14,...weeks):14;
  const out=[]; for(let w=lo;w<=hi;w++) out.push({week:w,n:c[w]||0});
  return out;
}
function gridMap(){
  const byPick={};
  S.picks.forEach(p=>byPick[p.pickNumber]=p);
  const rounds=[];
  for(let r=1;r<=totalRounds();r++){
    const cells=[];
    for(let c=0;c<S.numTeams;c++){
      // find the pick number in this round belonging to team column c
      let num=null;
      for(let k=(r-1)*S.numTeams+1;k<=r*S.numTeams;k++)
        if(teamOnPick(k)===c){num=k;break;}
      cells.push({num,pick:byPick[num]||null});
    }
    rounds.push({round:r,cells});
  }
  return rounds;
}
function exportText(){
  const rows=leagueGrades(), me=rows[S.myTeamIdx];
  const L=me, nm=p=>p?p.n:'?';
  let t=`${S.sessionName||'Draft'} — ${S.numTeams} teams, ${totalRounds()} rounds\n`;
  t+=`${'='.repeat(46)}\n\n`;
  const wk=weeklySummary(S.myTeamIdx);
  t+=`${teamName(S.myTeamIdx)} — grade ${me.grade}\n`;
  t+=`${me.pts.toFixed(0)} projected starting points (${me.rank} of ${S.numTeams})\n`;
  t+=`${wk.mean.toFixed(1)} pts/week over weeks 1-13 (${wk.total.toFixed(0)} total)\n`;
  t+=`worst week: ${wk.lo.week} at ${wk.lo.pts.toFixed(1)}\n`;
  const gapw=wk.weeks.filter(x=>x.gaps.length);
  if(gapw.length) t+=`bye holes: ${gapw.map(x=>`wk${x.week} no ${[...new Set(x.gaps)].join('/')}`).join(', ')}\n`;
  t+=`\nSTARTERS\n`;
  const ORD={QB:0,RB:1,WR:2,TE:3,FLEX:4,K:5,DST:6};
  [...L.starters].sort((a,b)=>ORD[a.slot]-ORD[b.slot]).forEach(st=>
    t+=`  ${(st.slot==='FLEX'?'FLX':st.slot).padEnd(4)} ${nm(st.pl).padEnd(24)} ${st.pl.pts.total.toFixed(0).padStart(5)}\n`);
  if(L.bench.length){ t+=`\nBENCH\n`;
    L.bench.forEach(b=>t+=`  ${b.p.padEnd(4)} ${nm(b).padEnd(24)} ${b.pts.total.toFixed(0).padStart(5)}\n`); }
  t+=`\nLEAGUE\n`;
  [...rows].sort((a,b)=>a.rank-b.rank).forEach(r=>
    t+=`  ${String(r.rank).padStart(2)}. ${r.grade.padEnd(3)} ${teamName(r.idx).padEnd(16)} ${r.pts.toFixed(0)}\n`);
  t+=`\nFULL DRAFT\n`;
  S.picks.forEach(p=>{const pl=byId(p.playerId);
    t+=`  ${String(p.pickNumber).padStart(3)}  ${teamName(p.teamIdx).padEnd(16)} ${(pl?pl.n:p.manualName||'?').padEnd(24)} ${pl?pl.p:''}\n`;});

async function copyExport(btn){
  const t=exportText();
  try{ await navigator.clipboard.writeText(t); btn.textContent='Copied to clipboard'; }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.cssText='position:fixed;top:0;left:0;width:99%;height:60vh;z-index:99';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); btn.textContent='Copied'; }
    catch(e2){ btn.textContent='Select the text above and copy'; return; }
    ta.remove();
  }
  setTimeout(()=>{btn.textContent='Copy draft results';},2200);
}

/* Pull down on the sheet to dismiss it. Without this the gesture escapes to
   the page and Chrome treats it as pull-to-refresh. */
(function(){
  const sh=$('#sheet'); if(!sh) return;
  let y0=0, dy=0, dragging=false;
  sh.addEventListener('touchstart',e=>{
    if(sh.scrollTop>0||e.touches.length!==1) return;
    y0=e.touches[0].clientY; dy=0; dragging=true;
    sh.style.transition='none';
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!dragging) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0){ sh.style.transform=''; return; }      // scrolling up: hand it back
    if(sh.scrollTop>0){ dragging=false; sh.style.transform=''; return; }
    sh.style.transform=`translateY(${dy}px)`;
    $('#scrim').style.opacity=String(Math.max(0,1-dy/420));
    if(e.cancelable) e.preventDefault();             // and no page refresh
  },{passive:false});
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    sh.style.transition=''; sh.style.transform='';
    $('#scrim').style.opacity='';
    if(dy>90) closeSheet();
  };
  sh.addEventListener('touchend',end);
  sh.addEventListener('touchcancel',end);
})();

/* ---------- 11b. PLAYER NEWS ----------------------------------
   Injury designations and notes from Sleeper's public player feed: free, no key,
   and it serves permissive CORS headers — which matters because this app is a
   static page on GitHub Pages with no server of its own to proxy through.

   Real caveats, stated plainly:
   • This is the only outbound call the app makes besides its own update check.
     Everything here fails silently and the draft carries on — a dead feed must
     never cost a pick.
   • Designations lag. A pull in Wednesday practice reaches this feed when the
     team files a status change, which can be hours. Treat a hit as confirmation;
     never treat absence as an all-clear.
   • The payload is large, so it is fetched once and cached in IndexedDB.
   • I could not reach this endpoint from the machine this was built on, so the
     call path is unverified. Press "Refresh player news" in Setup on wifi well
     before draft day and confirm a timestamp appears rather than an error. */
const NEWS_URL='https://api.sleeper.app/v1/players/nfl';
/* Sleeper's player feed is injury designations only — no outlooks, no good news.
   The one positive signal it does expose is waiver-add velocity: when a name
   spikes across every league at once something happened to him, and in August
   that is usually a promotion, a camp report, or the man ahead of him going
   down. It is a "look into this" flag, not an explanation. */
const TREND_URL='https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=50';
/* ESPN's public news JSON: actual headlines, which is the one thing Sleeper has
   none of. Each article carries athlete categories, so a headline can be pinned
   to a player. Keyed on NAME ALONE — the category rarely carries a team, and a
   headline about a player is about him wherever he plays. */
const ESPN_URL='https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100';
const espnKey=n=>{
  const s=String(n||'').toLowerCase().replace(/[^a-z ]/g,'')
    .replace(/\s+(jr|sr|ii|iii|iv|v)$/,'').trim().split(' ').filter(Boolean);
  return s.length?`${s[0][0]}.${s[s.length-1]}`:'';
};
const NEWS_MAX_AGE=6*3600*1000;
let NEWS={by:{},at:0,state:'idle'};
const newsKey=(n,t)=>{
  const s=String(n||'').toLowerCase().replace(/[^a-z ]/g,'')
    .replace(/\s+(jr|sr|ii|iii|iv|v)$/,'').trim();
  const p=s.split(' ').filter(Boolean);
  return p.length?`${p[0][0]}.${p[p.length-1]}|${String(t||'').toUpperCase()}`:'';
};
function indexNews(raw){
  const by={};
  Object.values(raw||{}).forEach(p=>{
    if(!p||!p.full_name) return;
    const st=p.injury_status||null;
    if(!st&&(!p.status||p.status==='Active')) return;      // nothing to report
    by[newsKey(p.full_name,p.team||'')]=
      {st,note:p.injury_notes||null,body:p.injury_body_part||null,status:p.status||null};
  });
  return by;
}
/* Live depth-chart order, kept separate from the injury map because it is
   wanted for EVERY player, not only the ones with something wrong. The baked
   slots come from a 4for4 PDF snapshot; camp battles move after that, and a
   promotion is exactly the kind of thing worth catching on draft morning. */
function indexDepth(raw){
  const d={};
  Object.values(raw||{}).forEach(p=>{
    if(!p||!p.full_name||!p.team) return;
    const o=p.depth_chart_order;
    if(typeof o==='number'&&o>0) d[newsKey(p.full_name,p.team)]=o;
  });
  return d;
}
function indexEspn(json){
  const by={};
  (json&&json.articles||[]).forEach(a=>{
    const head=a.headline||a.description; if(!head) return;
    const url=a.links&&a.links.web&&a.links.web.href||null;
    (a.categories||[]).forEach(c=>{
      const nm=(c.athlete&&(c.athlete.displayName||c.athlete.description))
             ||(c.type==='athlete'?c.description:null);
      if(!nm) return;
      const k=espnKey(nm); if(!k) return;
      (by[k]=by[k]||[]).push({h:head,u:url,at:a.published||a.lastModified||null});
    });
  });
  Object.keys(by).forEach(k=>{ by[k]=by[k].slice(0,3); });
  return by;
}
async function loadNews(force){
  let cached=null;
  try{ cached=await storage.getCache('news'); }catch(e){}
  if(!force&&cached&&cached.by&&Date.now()-cached.at<NEWS_MAX_AGE){
    NEWS={by:cached.by,trend:cached.trend||{},dco:cached.dco||{},espn:cached.espn||{},
          at:cached.at,state:'ok'}; return NEWS;
  }
  NEWS.state='loading';
  try{
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),12000);
    const res=await fetch(NEWS_URL,{signal:ctl.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('http '+res.status);
    const raw=await res.json();
    const by=indexNews(raw);
    /* Best-effort second call, deliberately outside the feed's own try: if the
       trending endpoint fails we still keep the injury data. */
    let trend={};
    try{
      const tr=await fetch(TREND_URL);
      if(tr.ok){
        const arr=await tr.json();
        const max=Math.max(1,...arr.map(x=>x.count||0));
        arr.forEach(x=>{ const pl=raw[x.player_id];
          if(pl&&pl.full_name)
            trend[newsKey(pl.full_name,pl.team||'')]={n:x.count||0,rel:(x.count||0)/max}; });
      }
    }catch(e){}
    const dco=indexDepth(raw);
    /* Best-effort, deliberately outside the feed's own try: if ESPN is down we
       still keep injuries, depth and trends. */
    let espn={};
    try{
      const er=await fetch(ESPN_URL);
      if(er.ok) espn=indexEspn(await er.json());
    }catch(e){}
    NEWS={by,trend,dco,espn,at:Date.now(),state:'ok'};
    try{ await storage.putCache('news',{by,trend,dco,espn,at:NEWS.at}); }catch(e){}
  }catch(e){
    /* Offline, blocked, or the feed moved. Fall back to whatever was cached,
       however old, and say how old rather than pretending it is current. */
    NEWS=(cached&&cached.by)
      ?{by:cached.by,trend:cached.trend||{},dco:cached.dco||{},espn:cached.espn||{},
        at:cached.at,state:'stale'}
      :{by:{},trend:{},dco:{},espn:{},at:0,state:'error'};
  }
  return NEWS;
}
function newsFor(p){ return NEWS.by[newsKey(p.n,p.t)]||null; }
function trendFor(p){ return NEWS.trend?(NEWS.trend[newsKey(p.n,p.t)]||null):null; }
function liveDepth(p){ return NEWS.dco?(NEWS.dco[newsKey(p.n,p.t)]||null):null; }
function headlines(p){ return NEWS.espn?(NEWS.espn[espnKey(p.n)]||[]):[]; }
function agoFrom(ts){
  if(!ts) return '';
  const h=(Date.now()-new Date(ts).getTime())/3600000;
  if(!isFinite(h)||h<0) return '';
  return h<1?'just now':(h<24?`${Math.round(h)}h ago`:`${Math.round(h/24)}d ago`);
}
const NEWS_SEVERE=/^(Out|IR|Doubtful|PUP|Sus|NA|Inactive)/i;
function newsAge(){
  if(!NEWS.at) return '';
  const h=(Date.now()-NEWS.at)/3600000;
  return h<1?`${Math.max(1,Math.round(h*60))} min ago`
           :(h<24?`${Math.round(h)}h ago`:`${Math.round(h/24)}d ago`);
}

/* ---------- 12. SELF-UPDATE ------------------------------------
   Installed to the home screen there is no reload button, so the app checks
   for itself: on launch, on resume from background, and on demand from Setup.
   It fetches its own index.html with caching bypassed and compares BUILD_ID. */
let _updSeen=null;
async function checkForUpdate(manual){
  try{
    const res=await fetch('./index.html?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const txt=await res.text();
    const m=txt.match(/const BUILD_ID='([^']*)'/);
    const rb=txt.match(/const BUILD='([^']*)'/);
    if(!m) throw new Error('no build id');
    if(m[1]===BUILD_ID){ if(manual) toast('You have the newest build.'); return false; }
    showUpdBar(rb?rb[1]:null);
    return true;
  }catch(e){
    if(manual) toast('Could not check — no connection.');
    return false;
  }
}
/* Offered once per session load, never applied silently: the saved values might
   be a deliberate house rule, and overwriting someone's scoring without asking
   would be worse than the staleness. */
function maybeOfferScoringUpdate(){
  if(!scoringIsStale(S)) return;
  const d=scoringDiffs(S);
  let el=$('#scoreBar');
  if(!el){ el=document.createElement('div'); el.id='scoreBar'; el.className='updbar';
    document.body.appendChild(el); }
  const list=d.slice(0,4).map(x=>`${esc(x.k)} ${x.was}\u2192${x.now}`).join(', ');
  el.innerHTML=`<span>This draft was set up under older scoring (${esc(list)}${d.length>4?`, +${d.length-4} more`:''}).
    Update to the current league rules?</span>
    <span><button id="scGo">Update</button><button class="x" id="scX" aria-label="Keep mine">✕</button></span>`;
  el.classList.add('on');
  $('#scGo').onclick=async()=>{
    S.scoring={...DEFAULT_SCORING}; S.scoringVersion=SCORING_VERSION;
    await storage.saveSession(S); rescoreAll(); el.classList.remove('on'); render();
    toast('Scoring updated to current league rules.');
  };
  $('#scX').onclick=()=>{ S.scoringVersion=SCORING_VERSION; storage.saveSession(S); el.classList.remove('on'); };
}
function showUpdBar(newBuild){
  if(_updSeen===BUILD_ID+':'+newBuild) return;      // don't nag after a dismiss
  let el=$('#updBar');
  if(!el){ el=document.createElement('div'); el.id='updBar'; document.body.appendChild(el); }
  el.innerHTML=`<span>New data available${newBuild&&newBuild!==BUILD?` (build ${esc(newBuild)})`:''} — your picks are saved.</span>
    <span><button id="updGo">Reload</button><button class="x" id="updX" aria-label="Dismiss">✕</button></span>`;
  el.classList.add('on');
  $('#updGo').onclick=applyUpdate;
  $('#updX').onclick=()=>{ _updSeen=BUILD_ID+':'+newBuild; el.classList.remove('on'); };
}
async function applyUpdate(){
  try{ if('serviceWorker' in navigator){
    const r=await navigator.serviceWorker.getRegistration();
    if(r) await r.update();
  }}catch(e){}
  /* cache-busted so no layer between here and the server can serve the old file */
  location.replace(location.pathname+'?u='+Date.now());
}
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:70;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4)';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t); t._t=setTimeout(()=>{t.style.opacity='0';},2600);
}

(async function init(){
  const vc=$('#verChip'); if(vc) vc.textContent='v'+BUILD;   // single source of truth
  const sb=$('#tgSort'); if(sb) sb.textContent='Sort: '+sortLabel(ui.sort);
  const list=await storage.listSessions();
  if(list.length){ S=list[0]; if(!S.skip)S.skip=[]; if(!S.botStyles)S.botStyles={}; if(!S.watch)S.watch=[];
    rescoreAll(); showView('Board'); render(); }
  else { renderSetup(); showView('Setup'); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  checkForUpdate(false);
  maybeOfferScoringUpdate();
  /* Non-blocking: the board is already on screen and stays usable whatever
     happens here. */
  loadNews(false).then(()=>{ if(NEWS.state==='ok'||NEWS.state==='stale') render(); });
  /* Android keeps a home-screen app resident: resuming fires no navigation,
     so the launch check alone would never run again. */
  let _last=Date.now();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&Date.now()-_last>60000){
      _last=Date.now(); checkForUpdate(false);
    }
  });
})();
</script>
