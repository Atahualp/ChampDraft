<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1216">
<title>Gridiron Marauder</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0F1216; --surface:#171C22; --surface2:#1E252D; --line:#2A333D;
  --text:#E8EDF2; --dim:#8A97A6; --faint:#5D6A78;
  --accent:#F2A03D; --accent-ink:#1A1206;
  --pos:#4FD1A5; --neg:#E8695E;
  --qb:#B98CE8; --rb:#5FBF8E; --wr:#4FA8DB; --te:#E0A03D; --k:#8E9AA8; --dst:#C97F62;
  --r:10px; --tap:44px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media(prefers-color-scheme:light){
  :root{--ink:#F4F6F8;--surface:#FFFFFF;--surface2:#EDF1F5;--line:#DDE4EB;
        --text:#101720;--dim:#5B6875;--faint:#8996A4;--accent:#C7761B;--accent-ink:#FFFFFF;
        --pos:#127D5E;--neg:#C0392B;
        --qb:#7B4FC0;--rb:#1F7A52;--wr:#1B6E9C;--te:#A06813;--k:#5F6B78;--dst:#94553A;}
}
html[data-theme=light]{--ink:#F4F6F8;--surface:#FFFFFF;--surface2:#EDF1F5;--line:#DDE4EB;
  --text:#101720;--dim:#5B6875;--faint:#8996A4;--accent:#C7761B;--accent-ink:#FFFFFF;
  --pos:#127D5E;--neg:#C0392B;--qb:#7B4FC0;--rb:#1F7A52;--wr:#1B6E9C;--te:#A06813;--k:#5F6B78;--dst:#94553A;}
html[data-theme=dark]{--ink:#0F1216;--surface:#171C22;--surface2:#1E252D;--line:#2A333D;
  --text:#E8EDF2;--dim:#8A97A6;--faint:#5D6A78;--accent:#F2A03D;--accent-ink:#1A1206;
  --pos:#4FD1A5;--neg:#E8695E;--qb:#B98CE8;--rb:#5FBF8E;--wr:#4FA8DB;--te:#E0A03D;--k:#8E9AA8;--dst:#C97F62;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  padding-bottom:calc(58px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:9px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
  border-bottom:1px solid var(--line);background:var(--ink)}
.brandmark{display:block;flex:none}
.brandtext{flex:1;min-width:0}
.brandname{font-size:13px;font-weight:700;letter-spacing:.06em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandsub{font-size:10px;letter-spacing:.11em;color:var(--faint);line-height:1.3}
.ver{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;flex:none}
.clockmark{display:block;flex:none;border-radius:3px}
/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:var(--ink);
  padding:8px 12px 0;border-bottom:1px solid var(--line)}
.clock{display:flex;align-items:baseline;gap:10px;padding-bottom:8px}
.clock .rd{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.03em}
.clock .who{font-size:13px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.onclock{color:var(--accent);font-weight:700}
.searchrow{display:flex;gap:8px;padding-bottom:8px}
.searchrow input{flex:1;min-height:var(--tap);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:0 12px;outline:none}
.searchrow input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;
  white-space:nowrap;color:var(--dim)}
.tab[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggles{display:flex;gap:6px;padding-bottom:8px;flex-wrap:wrap}
.tg{min-height:32px;padding:0 11px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);font-size:12px;color:var(--dim)}
.tg[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}

/* ---- suggestions ---- */
.sugg{margin:10px 12px 0;border:1px solid var(--accent);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
.sugg h2{margin:0;padding:8px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent);font-weight:800}
.sug{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.sug:first-of-type{border-top:0}
.sug .rank{font-family:var(--mono);font-size:11px;color:var(--faint);width:14px}
.sug .body{flex:1;min-width:0}
.sug .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .why{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- rows ---- */
.list{padding:8px 12px 0}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  min-height:var(--tap);padding:8px 10px;margin-bottom:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r)}
.row.gone{opacity:.4}
.row .idx{font-family:var(--mono);font-size:11px;color:var(--faint);width:26px;flex:none}
.badge{flex:none;width:32px;height:22px;border-radius:5px;display:grid;place-items:center;
  font-size:10px;font-weight:800;letter-spacing:.04em;color:#0B0E12}
.b-QB{background:var(--qb)}.b-RB{background:var(--rb)}.b-WR{background:var(--wr)}
.b-TE{background:var(--te)}.b-K{background:var(--k)}.b-DST{background:var(--dst)}
.row .body{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--dim);display:flex;gap:7px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .fig{text-align:right;flex:none}
.row .vorp{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.03em}
.row .sub{font-family:var(--mono);font-size:10px;color:var(--faint)}
.up{color:var(--pos)}.down{color:var(--neg)}
.steal{color:var(--accent);font-weight:700}
.est{font-size:9px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 3px}

/* signature: cost-of-waiting gauge */
.gauge{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:5px}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.25,1);
  max-height:86vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.sheet.on{transform:none}
.grab{width:34px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet .sub2{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.act{display:block;width:100%;min-height:var(--tap);border-radius:var(--r);margin-bottom:8px;
  font-weight:650;background:var(--surface2);border:1px solid var(--line)}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.danger{color:var(--neg)}
.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.teamgrid button{min-height:var(--tap);border-radius:8px;background:var(--surface2);
  border:1px solid var(--line);font-size:13px;padding:0 8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.statline div{background:var(--surface2);border-radius:8px;padding:8px}
.statline .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.statline .v{font-family:var(--mono);font-size:16px;font-weight:700}

/* ---- nav ---- */
#cmpBar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));
  z-index:48;display:none;align-items:center;justify-content:space-between;gap:8px;
  background:var(--accent);color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
#cmpBar.on{display:flex}
#cmpBar button{background:transparent;border:0;color:#fff;font-size:16px;padding:2px 6px}
.cmpgrid{display:grid;grid-template-columns:minmax(70px,1fr) 1fr 1fr;gap:7px 10px;
  margin:12px 0;font-size:13px;align-items:baseline}
.cmpgrid .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.cmpgrid .hd{font-weight:700;font-size:13px;line-height:1.2}
.cmpgrid .num.win,.cmpgrid .win{color:var(--good);font-weight:700}
.verdict{background:var(--bg2,rgba(255,255,255,.05));border-radius:12px;padding:12px 14px;
  margin:10px 0 2px;font-size:14px;line-height:1.45}
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:58px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px}
nav button .ic{font-size:17px;line-height:1}
nav button[aria-pressed=true]{color:var(--accent)}

/* ---- panels ---- */
.panel{padding:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.slot{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.slot:last-child{border-bottom:0}
.slot .empty{color:var(--faint);font-style:italic}
.need{display:inline-block;background:var(--surface2);border-radius:5px;padding:2px 7px;
  font-size:11px;margin:2px 4px 2px 0;font-family:var(--mono)}
.warn{color:var(--neg);font-size:12px;margin-top:6px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.08em}
label.f input,label.f select{width:100%;min-height:var(--tap);background:var(--surface2);
  border:1px solid var(--line);border-radius:8px;padding:0 10px;outline:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:11.5px;color:var(--faint);margin:-4px 0 10px}
.hidden{display:none!important}
.empty-state{text-align:center;color:var(--dim);padding:36px 20px;font-size:14px}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface2);
  color:var(--dim);margin-left:6px}
.pilllive{background:var(--accent);color:var(--accent-ink)}
.log{font-family:var(--mono);font-size:11.5px;color:var(--dim);max-height:180px;
  overflow-y:auto;overscroll-behavior:contain}
.log div{padding:2px 0;border-bottom:1px solid var(--line)}
.gradewrap{display:flex;align-items:center;gap:14px}
.gradebig{font-family:var(--mono);font-size:44px;font-weight:800;letter-spacing:-.05em;
  color:var(--accent);line-height:1;min-width:74px}
.gradesm{font-family:var(--mono);font-weight:700;color:var(--accent);margin-left:6px}

/* watchlist */
.watch{margin:10px 12px 0;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
.watch h2{margin:0;padding:8px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:800;border-bottom:1px solid var(--line)}
.watch .alert{color:var(--neg)}
.wrow{display:flex;gap:10px;align-items:center;padding:8px 12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.wrow:last-of-type{border-bottom:0}
.starred{color:var(--accent)}
/* handcuff / stack tags */
.tagf{font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;border-radius:3px;
  vertical-align:1px;margin-left:4px}
.tag-hc{background:var(--rb);color:#0B0E12}
.tag-st{background:var(--qb);color:#0B0E12}
/* bye strip */
.byestrip{display:flex;gap:3px;align-items:flex-end;padding:4px 0 2px}
.byecol{flex:1;text-align:center;min-width:0}
.byebar{background:var(--surface2);border-radius:3px 3px 0 0;border:1px solid var(--line);
  border-bottom:0}
.byebar.warn2{background:var(--accent);border-color:var(--accent)}
.byebar.bad{background:var(--neg);border-color:var(--neg)}
.byenum{font-size:10px;color:var(--text);height:13px}
.byewk{font-size:9px;color:var(--faint)}
/* draft board grid */
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface)}
.dgrid{border-collapse:collapse;font-size:10px;width:max-content}
.dgrid th,.dgrid td{border:1px solid var(--line);padding:3px 4px;min-width:66px;
  max-width:66px;text-align:left;vertical-align:top}
.dgrid th{position:sticky;top:0;background:var(--surface2);color:var(--dim);
  font-size:9px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.dgrid th.me,.dgrid td.me{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dgrid .rh{position:sticky;left:0;background:var(--surface2);min-width:24px;max-width:24px;
  color:var(--faint);text-align:center;z-index:2}
.dgrid thead .rh{z-index:3}
.gp{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  border-left:3px solid var(--line);padding-left:4px}
.gp-QB{border-color:var(--qb)}.gp-RB{border-color:var(--rb)}.gp-WR{border-color:var(--wr)}
.gp-TE{border-color:var(--te)}.gp-K{border-color:var(--k)}.gp-DST{border-color:var(--dst)}
.gn{font-size:8px;color:var(--faint)}
.gn.dim{opacity:.5}
/* Wider viewports get the brand permanently and a two-column board, so the
   suggestions stop pushing the player list below the fold. No manual toggle:
   a media query cannot be set wrong, and it is right on a tablet too. */
@media(min-width:820px){
  body{max-width:1180px;margin:0 auto;padding-bottom:0}
  .brand{position:sticky;top:0;z-index:41;padding:10px 16px}
  .brandname{font-size:15px}
  header{top:53px;padding:10px 16px 0}
  main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);
    gap:16px;padding:0 16px;align-items:start}
  #viewBoard{display:contents}
  #suggWrap,#watchWrap{grid-column:2;position:sticky;top:150px;margin:10px 0 0}
  .list{grid-column:1;padding:10px 0 0}
  #viewTeam,#viewTeams,#viewRecap,#viewSetup{grid-column:1/-1}
  nav{position:sticky;bottom:auto;top:0;max-width:1180px;margin:0 auto}
  .row{min-height:40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="brand">
  <img class="brandmark" src="mark.png" alt="" width="30" height="23">
  <div class="brandtext">
    <div class="brandname">GRIDIRON MARAUDER</div>
    <div class="brandsub">DRAFT COMPANION</div>
  </div>
  <span class="ver num" id="verChip"></span>
</div>
<header>
  <div class="clock">
    <img class="clockmark" src="mark.png" alt="" width="20" height="15">
    <span class="rd" id="clockRd">—</span>
    <span class="who" id="clockWho">No draft loaded</span>
    <button class="tg" id="themeBtn" title="Toggle theme">◐</button>
  </div>
  <div class="searchrow" id="searchRow">
    <input id="q" type="search" placeholder="Search players" autocomplete="off" autocorrect="off">
    <button class="tg" id="undoBtn" title="Undo last pick">↩ Undo</button>
  </div>
  <div class="tabs" id="posTabs"></div>
  <div class="toggles">
    <button class="tg" id="tgHide" aria-pressed="true">Hide drafted</button>
    <button class="tg" id="tgSteal" aria-pressed="false">Steals only</button>
    <button class="tg" id="tgSort">Sort: VORP</button>
    <button class="tg" id="simBtn" aria-pressed="false">▶ Auto-sim</button>
  </div>
</header>

<main>
  <div id="viewBoard">
    <div id="watchWrap"></div>
    <div id="suggWrap"></div>
    <div class="list" id="board"></div>
  </div>
  <div id="viewTeam" class="panel hidden"></div>
  <div id="viewTeams" class="panel hidden"></div>
  <div id="viewRecap" class="panel hidden"></div>
  <div id="viewSetup" class="panel hidden"></div>
</main>

<nav>
  <button data-view="Board" aria-pressed="true"><span class="ic">▤</span>Board</button>
  <button data-view="Team" aria-pressed="false"><span class="ic">★</span>My team</button>
  <button data-view="Teams" aria-pressed="false"><span class="ic">▦</span>League</button>
  <button data-view="Recap" aria-pressed="false"><span class="ic">◆</span>Recap</button>
  <button data-view="Setup" aria-pressed="false"><span class="ic">⚙</span>Setup</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
/* ============================================================
   DRAFT ROOM — companion draft assistant
   Player data and its labels live in PLAYERS / META below — swapping sources
   is a data change, never a code change.
   ============================================================ */
const BUILD='14';   // keep in step with CACHE in sw.js
const PLAYERS = /*__PLAYERS__*/[];
/* Where the numbers came from. Everything user-visible reads its label from
   here, so swapping data sources is a data change, not a code change. */
const META = Object.assign({
  stamp:'unknown', proj:'projections', adp:'ADP',
  rank1:'expert rank', rank2:'expert rank', rank3:'consensus', trustedAbbr:'Experts', notes:''
}, /*__META__*/{});
const hasR1=PLAYERS.some(p=>p.r1!=null), hasR2=PLAYERS.some(p=>p.r2!=null), hasR3=PLAYERS.some(p=>p.r3!=null);
/* The two trusted experts are DISPLAYED separately but their blend stays the
   arbitrage signal — disagreement with the market is only meaningful when it
   is their shared opinion, not one analyst's hot take. */
PLAYERS.forEach(p=>{p.tr=(p.r1!=null&&p.r2!=null)?(p.r1+p.r2)/2:(p.r1!=null?p.r1:(p.r2!=null?p.r2:null));});
const hasTrusted=PLAYERS.some(p=>p.tr!=null);

/* ---------- 1. STORAGE LAYER ---------------------------------
   All persistence goes through this object. App logic never
   touches IndexedDB directly, so swapping in Firestore later
   is a single-module change (spec §7).
-------------------------------------------------------------- */
const storage = (() => {
  const DB='draftroom', STORE='sessions';
  let db=null, mem=new Map(), opening=null, degraded=false;
  /* FIX: the old version latched useMem=true on a 1.5s timeout and never
     retried, so one slow open meant the whole draft lived in RAM and died on
     refresh. Now a timeout only degrades THIS call; the next one retries. */
  function open(){
    if(db) return Promise.resolve(db);
    if(opening) return opening;
    opening=new Promise(res=>{
      let rq, settled=false;
      const done=v=>{ if(!settled){settled=true; opening=null; res(v);} };
      try{ rq=indexedDB.open(DB,1); }
      catch(e){ degraded=true; return done(null); }
      rq.onupgradeneeded=()=>{
        const d=rq.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'sessionId'});
      };
      rq.onsuccess=()=>{ db=rq.result; degraded=false; done(db); };
      rq.onerror=()=>{ degraded=true; done(null); };
      rq.onblocked=()=>{ degraded=true; done(null); };
      setTimeout(()=>{ if(!settled){ degraded=true; done(null); } },2500);
    });
    return opening;
  }
  const tx=(mode,fn)=>open().then(d=>{
    if(!d) return fn(null);
    return new Promise((res,rej)=>{
      const t=d.transaction(STORE,mode), s=t.objectStore(STORE);
      const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);
      t.onerror=()=>rej(t.error);
    });
  });
  return {
    async saveSession(s){ s.updatedAt=Date.now(); mem.set(s.sessionId,JSON.parse(JSON.stringify(s)));
      return tx('readwrite',st=>st&&st.put(s)); },
    async loadSession(id){ const r=await tx('readonly',st=>st&&st.get(id));
      return (r&&r.sessionId)?r:(mem.get(id)||null); },
    async listSessions(){ const r=await tx('readonly',st=>st&&st.getAll());
      const arr=(r&&r.length!==undefined)?r:[...mem.values()];
      return arr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); },
    async appendPick(id,pick){ const s=await this.loadSession(id); if(!s) return null;
      if(s.picks.some(p=>p.pickNumber===pick.pickNumber)) return s;  // dedupe by pickNumber
      s.picks.push(pick); await this.saveSession(s); return s; },
    async deleteSession(id){ mem.delete(id); return tx('readwrite',st=>st&&st.delete(id)); },
    isDegraded(){ return degraded; }
  };
})();

/* ---------- 2. SCORING ENGINE (pure functions) ---------------- */
/* FIX: parseFloat('') is NaN, and NaN silently propagates through every
   multiplication until the whole board is unsortable. Coerce at the boundary. */
const num=(v,d)=>{const n=parseFloat(v); return Number.isFinite(n)?n:d;};
const int=(v,d,lo,hi)=>{const n=parseInt(v,10);
  return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):d;};
const DEFAULT_SCORING={
  passYds:0.04,passTD:6,passTD40:2,passTD50:3,passInt:-2,passGame300:2,passGame400:3,
  rushYds:0.1,rushTD:6,rushGame100:3,rushGame200:5,
  recYds:0.1,recPer5:2.5,recTD:6,recGame100:3,recGame200:5,
  fgValue:3.6,pat:1,
  sack:1,dstInt:2,fumbleRec:2,fumbleForced:1,safety:2,defTD:6,
  fumbleLost:0, games:17,
  cvRec:0.70,cvRush:0.55,cvPass:0.28
};
const DEFAULT_ROSTER={QB:1,RB:2,WR:2,TE:1,FLEX:1,DST:1,K:1,BENCH:7};
const ROSTER_MAX={QB:4,DST:3,K:3};
const POSITIONS=['QB','RB','WR','TE','K','DST'];

// regularized lower incomplete gamma P(a,x) — for yardage-threshold games
function gammaP(a,x){
  if(x<=0) return 0;
  const lg=logGamma(a);
  if(x<a+1){ let s=1/a,t=s;
    for(let n=1;n<300;n++){ t*=x/(a+n); s+=t; if(Math.abs(t)<Math.abs(s)*1e-12) break; }
    return s*Math.exp(-x+a*Math.log(x)-lg);
  }
  let b=x+1-a,c=1e300,d=1/b,h=d;
  for(let i=1;i<300;i++){ const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<1e-300)d=1e-300;
    c=b+an/c; if(Math.abs(c)<1e-300)c=1e-300; d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<1e-12) break; }
  return 1-Math.exp(-x+a*Math.log(x)-lg)*h;
}
function logGamma(z){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
    12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-logGamma(1-z);
  z-=1; let x=0.99999999999980993; for(let i=0;i<8;i++) x+=g[i]/(z+i+1);
  const t=z+7.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
}
const poissonSF=(k,m)=>{ // P(X >= k)
  if(m<=0) return 0; if(k<=0) return 1;
  let term=Math.exp(-m), cdf=term;
  for(let i=1;i<k;i++){ term*=m/i; cdf+=term; }
  return Math.max(0,1-cdf);
};
const gamesOver=(total,thresh,cv,G)=>{
  if(!total||total<=0) return 0;
  const m=total/G, a=1/(cv*cv);
  return (1-gammaP(a,thresh*a/m))*G;
};

/* computeProjectedPoints — returns exact linear part and modeled bonus part
   separately so the UI can show how much of a total is estimated (spec §3.2) */
/* FIX: defence in depth — a bad value stored by an older session must not
   poison the engine, so fall back to the default for any non-finite rule. */
function safeScoring(sc){
  const out={...DEFAULT_SCORING};
  Object.keys(DEFAULT_SCORING).forEach(k=>{
    out[k]=Number.isFinite(sc&&sc[k])?sc[k]:DEFAULT_SCORING[k];
  });
  if(!(out.games>0)) out.games=17;
  return out;
}
function computeProjectedPoints(pl,sc){
  const s=pl.s||{}, G=sc.games>0?sc.games:17;
  let linear=0, bonus=0;
  if(pl.p==='K'){
    linear=(s.fg||0)*sc.fgValue+(s.xpt||0)*sc.pat;
    return {linear,bonus:0,total:linear,bonusShare:0};
  }
  if(pl.p==='DST'){
    linear=(s.sack||0)*sc.sack+(s.dint||0)*sc.dstInt+(s.fr||0)*sc.fumbleRec
          +(s.ff||0)*sc.fumbleForced+(s.dtd||0)*sc.defTD+(s.safety||0)*sc.safety;
    return {linear,bonus:0,total:linear,bonusShare:0};
  }
  linear=(s.passYds||0)*sc.passYds+(s.passTD||0)*sc.passTD+(s.passInt||0)*sc.passInt
        +(s.rushYds||0)*sc.rushYds+(s.rushTD||0)*sc.rushTD
        +(s.recYds||0)*sc.recYds+(s.recTD||0)*sc.recTD;
  // per-game reception buckets: floor(rec/5) each game — NOT a flat per-catch rate
  if(s.rec&&sc.recPer5){ const m=s.rec/G; let b=0;
    for(let i=1;i<=6;i++) b+=poissonSF(5*i,m);
    bonus+=b*sc.recPer5*G; }
  if(s.recYds){ bonus+=gamesOver(s.recYds,100,sc.cvRec,G)*sc.recGame100
                     +gamesOver(s.recYds,200,sc.cvRec,G)*(sc.recGame200-sc.recGame100); }
  if(s.rushYds){ bonus+=gamesOver(s.rushYds,100,sc.cvRush,G)*sc.rushGame100
                      +gamesOver(s.rushYds,200,sc.cvRush,G)*(sc.rushGame200-sc.rushGame100); }
  if(s.passYds){ bonus+=gamesOver(s.passYds,300,sc.cvPass,G)*sc.passGame300
                      +gamesOver(s.passYds,400,sc.cvPass,G)*(sc.passGame400-sc.passGame300); }
  const total=linear+bonus;
  return {linear,bonus,total,bonusShare:total>0?bonus/total:0};
}

/* replacement baselines derived from league settings, FLEX resolved dynamically */
function computeBaselines(scored,st){
  const ded={QB:st.rosterSlots.QB*st.numTeams,RB:st.rosterSlots.RB*st.numTeams,
             WR:st.rosterSlots.WR*st.numTeams,TE:st.rosterSlots.TE*st.numTeams,
             K:st.rosterSlots.K*st.numTeams,DST:st.rosterSlots.DST*st.numTeams};
  const byPos={}; POSITIONS.forEach(p=>byPos[p]=scored.filter(x=>x.p===p)
    .sort((a,b)=>b.pts.total-a.pts.total));
  const flexN=(st.rosterSlots.FLEX||0)*st.numTeams;
  const spill=[];
  ['RB','WR','TE'].forEach(p=>byPos[p].slice(ded[p]).forEach(x=>spill.push(x)));
  spill.sort((a,b)=>b.pts.total-a.pts.total);
  const taken=spill.slice(0,flexN);
  const base={...ded};
  taken.forEach(x=>base[x.p]++);
  const repl={};
  POSITIONS.forEach(p=>{
    const arr=byPos[p]; const i=Math.min(base[p],arr.length)-1;
    repl[p]=i>=0&&arr[i]?arr[i].pts.total:0;
  });
  return {base,repl,byPos};
}

/* ---------- 3. DRAFT STATE (all derived, nothing duplicated) ---- */
let S=null;                    // current session
let scored=[], replPts={}, baseIdx={}, posRankMap={};
let ui={view:'Board',pos:'ALL',q:'',hide:true,steals:false,sort:'vorp',sheetFor:null,auto:false,league:'grid',compareWith:null};

const totalRounds=()=>{const r=S.rosterSlots;return r.QB+r.RB+r.WR+r.TE+r.FLEX+r.K+r.DST+r.BENCH;};
const totalPicks=()=>totalRounds()*S.numTeams;
const roundOf=n=>Math.floor((n-1)/S.numTeams)+1;
function teamOnPick(n){                        // snake order
  const r=roundOf(n), i=(n-1)%S.numTeams;
  return (r%2===1)?i:(S.numTeams-1-i);
}
const nextPickNumber=()=>S.picks.length+1;
function myNextPick(from){
  for(let n=from;n<=totalPicks();n++) if(teamOnPick(n)===S.myTeamIdx) return n;
  return null;
}
/* FIX: this allocated a fresh Set on every call and is hit many times per
   render. Memoised against pick count, which only ever grows or is reset. */
let _dIdCache={n:-1,set:null};
const draftedIds=()=>{
  if(_dIdCache.n!==S.picks.length){
    _dIdCache={n:S.picks.length,set:new Set(S.picks.map(p=>p.playerId).filter(Boolean))};
  }
  return _dIdCache.set;
};
const rosterOf=idx=>S.picks.filter(p=>p.teamIdx===idx);

function rescoreAll(){
  S.scoring=safeScoring(S.scoring);                 // FIX: never score with NaN
  scored=PLAYERS.map(pl=>({...pl,pts:computeProjectedPoints(pl,S.scoring)}));
  const {base,repl}=computeBaselines(scored,S);
  replPts=repl; baseIdx=base;
  scored.forEach(p=>p.vorp=p.pts.total-(replPts[p.p]||0));
  posRankMap={};
  POSITIONS.forEach(p=>{
    scored.filter(x=>x.p===p).sort((a,b)=>b.vorp-a.vorp)
      .forEach((x,i)=>posRankMap[x.id]=i+1);
  });
  scored.sort((a,b)=>b.vorp-a.vorp);
  scored.forEach((x,i)=>x.ovr=i+1);
  rebuildDraftRanks();
}

/* ---------- 4. SURVIVAL + COST OF WAITING (spec §5) ------------ */
function rawMarketRank(p){
  /* market proxy order: ADP, then the six-analyst consensus, then the trusted
     blend. A single expert never stands in for the market. */
  return p.a!=null?p.a:(p.r3!=null?p.r3:(p.tr!=null?p.tr:360));
}
/* Kickers and defenses sit high in raw ADP but nobody takes them until the end.
   Leaving them in the ordering makes every skill player look like a reach and
   poisons the drift estimate, so rank the pool by when players actually go. */
function rebuildDraftRanks(){
  const skill=scored.filter(p=>p.p!=='K'&&p.p!=='DST')
    .sort((a,b)=>rawMarketRank(a)-rawMarketRank(b));
  skill.forEach((p,i)=>p.dr=i+1);
  const lateStart=Math.max(skill.length,totalPicks()-S.numTeams*2);
  scored.filter(p=>p.p==='K'||p.p==='DST')
    .sort((a,b)=>rawMarketRank(a)-rawMarketRank(b))
    .forEach((p,i)=>p.dr=lateStart+i+1);
}
function marketRank(p){ return p.dr!=null?p.dr:rawMarketRank(p); }
/* Survival: a player is taken when enough picks TARGETING HIS POSITION happen
   before he does. Teams draft for need, not strict rank order, so a top-ranked
   player often survives simply because nobody picking soon wants that position.
   We count expected positional demand across the intervening picks and compare
   it to how many players at his position sit ahead of him. */
function survivalContext(avail,fromPick,toPick){
  const posQ={};
  POSITIONS.forEach(pos=>{
    avail.filter(x=>x.p===pos).sort((a,b)=>marketRank(a)-marketRank(b))
      .forEach((x,i)=>posQ[x.id]=i+1);
  });
  const demand={}; POSITIONS.forEach(p=>demand[p]=0);
  const R=totalRounds();
  for(let k=fromPick;k<toPick&&k<=totalPicks();k++){
    const idx=teamOnPick(k); if(idx==null) continue;
    const st=needsOf(idx), left=R-st.filled, w={};
    POSITIONS.forEach(p=>{
      w[p]=0;
      if(!canDraftWith(st.cnt,p)) return;
      if(p==='K'||p==='DST'){ if(st.need[p]>0&&left<=4) w[p]=0.9; return; }
      /* rooms do not hoard tight ends — a team holding one streams the position
         from waivers, so its residual TE demand is nearly zero */
      if(p==='TE'&&st.cnt.TE>=1){ w[p]=0.04; return; }
      if(st.need[p]>0) w[p]=1.0;
      else if(st.flex>0&&['RB','WR','TE'].includes(p)) w[p]=0.65;
      else w[p]=0.22;                       // best-available / bench depth
    });
    // each pick takes exactly ONE player, so its weight must sum to 1
    const tot=POSITIONS.reduce((a,p)=>a+w[p],0)||1;
    POSITIONS.forEach(p=>demand[p]+=w[p]/tot);
  }
  return {posQ,demand};
}
const normCdf=z=>{const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;};
function survival(pl,ctx){
  const j=ctx.posQ[pl.id]; if(j==null) return 1;
  const d=ctx.demand[pl.p]||0;
  if(d<=0) return 1;                 // FIX: zero intervening demand is certainty,
                                     // not a distribution — at the snake turn the
                                     // old floor gave the top player only 64%
  const sd=Math.max(1.1,1.9*Math.sqrt(d));
  return Math.min(1,Math.max(0,1-normCdf((d-j+0.5)/sd)));
}
function costOfWaiting(avail,ctx){
  const out={};
  POSITIONS.forEach(pos=>{
    const arr=avail.filter(p=>p.p===pos).sort((a,b)=>b.vorp-a.vorp).slice(0,25);
    if(!arr.length){out[pos]={now:0,later:0,cost:0,best:null};return;}
    const now=arr[0].vorp;
    let later=0,gone=1;
    for(const p of arr){ const s=survival(p,ctx);
      later+=p.vorp*s*gone; gone*=(1-s); if(gone<0.002)break; }
    out[pos]={now,later,cost:Math.max(0,now-later),best:arr[0]};
  });
  return out;
}
/* cliff = how many players remain above the next big VORP drop */
function cliff(avail,pos){
  const a=avail.filter(p=>p.p===pos).sort((x,y)=>y.vorp-x.vorp).slice(0,14);
  if(a.length<3) return null;
  let bi=0,bd=0;
  for(let i=0;i<a.length-1;i++){const d=a[i].vorp-a[i+1].vorp; if(d>bd){bd=d;bi=i;}}
  return bd>=8?{count:bi+1,drop:Math.round(bd)}:null;
}

/* FIX: survivalContext walks every intervening pick and asks needsOf() about
   the team on the clock, so the same team's roster was rescanned repeatedly
   within a single decision. Roster state only changes when a pick lands, so
   memoise on pick count. */
let _needsCache={n:-1,m:null};
function needsOf(idx){
  if(_needsCache.n!==S.picks.length) _needsCache={n:S.picks.length,m:new Map()};
  const hit=_needsCache.m.get(idx); if(hit) return hit;
  const out=computeNeeds(idx);
  _needsCache.m.set(idx,out);
  return out;
}
function computeNeeds(idx){
  const r=rosterOf(idx).map(p=>byId(p.playerId)).filter(Boolean);
  const cnt={};POSITIONS.forEach(p=>cnt[p]=r.filter(x=>x.p===p).length);
  const need={};
  POSITIONS.forEach(p=>need[p]=Math.max(0,(S.rosterSlots[p]||0)-cnt[p]));
  let flex=S.rosterSlots.FLEX||0;
  const spare=['RB','WR','TE'].reduce((s,p)=>s+Math.max(0,cnt[p]-(S.rosterSlots[p]||0)),0);
  flex=Math.max(0,flex-spare);
  return {cnt,need,flex,filled:r.length};
}
/* FIX: canDraft used to recompute needsOf() — an O(picks) roster scan — for
   every candidate player, making each decision O(players x picks). Callers now
   pass the counts they already computed. */
function canDraftWith(cnt,pos){
  return !(ROSTER_MAX[pos]&&cnt[pos]>=ROSTER_MAX[pos]);
}
function canDraft(idx,pos){ return canDraftWith(needsOf(idx).cnt,pos); }

/* Everything a two-pick plan needs to be priced, shared by the suggestion
   engine and the head-to-head compare so they can never disagree. */
function planEnv(){
  const drafted=draftedIds(), avail=scored.filter(p=>!drafted.has(p.id)&&!S.skip.includes(p.id));
  const pickNo=nextPickNumber(), nxt=myNextPick(pickNo+1)||totalPicks();
  const ctx=survivalContext(avail,pickNo+1,nxt);
  const {cnt,need,flex,filled}=needsOf(S.myTeamIdx);
  const roundsLeft=totalRounds()-filled;
  const stillRequired=POSITIONS.reduce((a,p)=>a+need[p],0)+flex;
  const mustFill=roundsLeft<=stillRequired;
  const isFlexEligible=p=>['RB','WR','TE'].includes(p);

  /* usefulness of the (k+1)-th body at a position, from effective starting
     slots — unchanged from before, just factored out so the lookahead can ask
     about hypothetical rosters */
  const startSlots={}; POSITIONS.forEach(p=>
    startSlots[p]=Math.max(0.5,(baseIdx[p]||S.numTeams)/S.numTeams));
  const usefulness=(pos,count)=>{
    const ss=startSlots[pos], surplus=(count+1)-ss;
    return surplus<=0?1:ss/(ss+surplus*2);
  };
  const adjVal=(pl,count)=>{
    const u=usefulness(pl.p,count), surplus=(count+1)-startSlots[pl.p];
    const stack=surplus>0?surplus*20:0;
    return (pl.vorp>0?pl.vorp*u:pl.vorp)-stack;
  };

  const eligible=p=>{
    if(!canDraftWith(cnt,p.p)) return false;
    if(p.p==='TE'&&cnt.TE>=1) return false;   // one TE, then stream — never suggest a second
    if(p.p==='K'||p.p==='DST') return need[p.p]>0 && roundsLeft<=4;
    if(mustFill && !(need[p.p]>0 || (flex>0 && isFlexEligible(p.p)))) return false;
    const slots=startSlots[p.p];
    if(slots<=1.2 && cnt[p.p]>=Math.ceil(slots)+1 && p.vorp<=0) return false;
    return true;
  };

  /* Per-position survival-ordered lists, computed once. bestLater(pos, skipId,
     countAfterMyPick) = E[best available at pos at my next pick], the same
     first-survivor chain costOfWaiting uses, but valued against the roster I
     WOULD have after this pick. */
  /* (candidate selection moved to suggestions(), which shares this env) */
  const byPos={};
  POSITIONS.forEach(pos=>{
    byPos[pos]=avail.filter(x=>x.p===pos).sort((a,b)=>b.vorp-a.vorp).slice(0,25)
      .map(x=>({x,s:survival(x,ctx)}));
  });
  const bestLater=(pos,skipId,count)=>{
    let e=0,gone=1;
    for(const {x,s} of byPos[pos]){
      if(x.id===skipId) continue;
      e+=adjVal(x,count)*s*gone; gone*=(1-s);
      if(gone<0.002) break;
    }
    return e;
  };

  return {avail,pickNo,nxt,ctx,cnt,need,flex,roundsLeft,mustFill,isFlexEligible,adjVal,eligible,bestLater};
}
/* TWO-PICK PLAN score for one candidate: what he adds now, plus the expected
   best pick still on the board at my next turn if I take him. */
function planScore(p,env){
  const {cnt,need,flex,roundsLeft,isFlexEligible,adjVal,bestLater,ctx}=env;
  const now=adjVal(p,cnt[p.p]);
  let next=-Infinity;
  for(const pos of POSITIONS){
    if(pos==='K'||pos==='DST'){          // gated exactly as the pick itself is
      if(!(need[pos]>0 && roundsLeft-1<=4)) continue;
    }
    if(!canDraftWith(cnt,pos) && pos!==p.p) continue;
    const cAfter=cnt[pos]+(pos===p.p?1:0);
    if(pos==='TE'&&cAfter>=1) continue;        // a second TE is never part of the plan
    if(ROSTER_MAX[pos]&&cAfter>=ROSTER_MAX[pos]) continue;
    const v=bestLater(pos,p.id,cAfter);
    if(v>next) next=v;
  }
  if(next===-Infinity) next=0;
  const needBonus=(need[p.p]>0?6:0)+((flex>0&&isFlexEligible(p.p))?3:0);
  return {now,next,needBonus,score:now+next+needBonus,surv:survival(p,ctx)};
}
function suggestions(){
  const env=planEnv();
  const cw=costOfWaiting(env.avail,env.ctx);   // still shown in whyText
  const cand=env.avail.filter(env.eligible)
    .sort((a,b)=>env.adjVal(b,env.cnt[b.p])-env.adjVal(a,env.cnt[a.p])).slice(0,24);
  return cand.map(p=>{
    const ps=planScore(p,env);
    return {p,score:ps.score,cost:cw[p.p]?cw[p.p].cost:0,surv:ps.surv,now:ps.now,next:ps.next};
  }).sort((a,b)=>b.score-a.score).slice(0,3)
    .map(x=>({...x,why:whyText(x,cw,env.avail,env.nxt)}));
}
/* head-to-head: both candidates priced with the identical machinery */
function comparePlayers(idA,idB){
  const a=byId(idA), b=byId(idB); if(!a||!b) return null;
  const env=planEnv();
  return {a,b,pa:planScore(a,env),pb:planScore(b,env),env};
}
function suggestionsSafe(){
  const s=suggestions();
  if(s.length) return s;
  // never show an empty panel — fall back to best available we can legally draft
  const drafted=draftedIds();
  const cnt0=needsOf(S.myTeamIdx).cnt;
  return scored.filter(p=>!drafted.has(p.id)&&canDraftWith(cnt0,p.p)&&!(p.p==='TE'&&cnt0.TE>=1))
    .slice(0,3).map(p=>({p,cost:0,surv:1,why:'best available'}));
}
/* rank among what's actually left at that position — a preseason rank is
   meaningless once forty receivers are off the board */
function availRank(pl,avail){
  return avail.filter(p=>p.p===pl.p&&p.vorp>pl.vorp).length+1;
}
function whyText(x,cw,avail,nxt){
  const p=x.p, bits=[];
  bits.push(`best ${p.p} left`.replace('best',availRank(p,avail)===1?'best':`#${availRank(p,avail)}`));
  { const d=Math.round(nextPickNumber()-p.ovr);
    if(d>=8) bits.push(`${d} past our board`);
    else if(p.a!=null){ const m=Math.round(nextPickNumber()-p.a);
      if(m>=8) bits.push(`${m} past ADP`); } }
  bits.push(`${Math.round(x.surv*100)}% to survive to ${nxt}`);
  if(x.cost>6) bits.push(`waiting costs ${Math.round(x.cost)}`);
  const cl=cliff(avail,p.p);
  if(cl&&cl.count<=3) bits.push(`${cl.count} left before −${cl.drop}`);
  return bits.slice(0,3).join(' · ');
}

/* ---------- 5. AUTO-PICK BOTS (mixed styles) ------------------- */
const STYLES=['chalk','chalk','needs','needs','sharp','gambler'];
/* stable per-session per-team dice roll, so a saved draft replays the same */
function botQuirk(idx){let h=2166136261;const s=String(S&&S.sessionId||'');
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  h=(h^Math.imul(idx+1,2654435761))>>>0;
  h=Math.imul(h^(h>>>15),2246822519)>>>0;h^=h>>>13;
  h=Math.imul(h,3266489917)>>>0;h^=h>>>16;return (h>>>0)%100;}
function botPick(idx){
  const drafted=draftedIds();
  const avail=scored.filter(p=>!drafted.has(p.id));
  const style=S.botStyles[idx]||'chalk';
  const {cnt,need,flex,filled}=needsOf(idx);
  const roundsLeft=totalRounds()-filled;
  const stillRequired=POSITIONS.reduce((s,p)=>s+need[p],0)+flex;
  const mustFill=roundsLeft<=stillRequired;
  const isFlexEligible=p=>['RB','WR','TE'].includes(p);
  const noise={chalk:3,needs:6,sharp:8,gambler:16}[style];
  /* Real rooms carry ONE tight end and stream the position off waivers.
     Roughly one team a draft grabs a second, late; nobody takes a third.
     Same restraint, softer, for a third quarterback. */
  const twoTE=botQuirk(idx)<5;
  let best=null,bs=-1e9;
  for(const p of avail){
    if(!canDraftWith(cnt,p.p)) continue;
    if(p.p==='TE'&&cnt.TE>=1){
      if(cnt.TE>=2) continue;                    // never a third
      if(!twoTE||roundsLeft>5) continue;         // rare team, endgame only
    }
    if(p.p==='QB'&&cnt.QB>=2&&roundsLeft>3) continue;
    if(p.p==='K'||p.p==='DST'){ if(need[p.p]<=0||roundsLeft>4) continue; }
    else if(mustFill && !(need[p.p]>0 || (flex>0 && isFlexEligible(p.p)))) continue;
    const mr=marketRank(p);
    const ss=Math.max(0.5,(baseIdx[p.p]||S.numTeams)/S.numTeams);
    const surplus=(cnt[p.p]+1)-ss;
    const useful=surplus<=0?1:ss/(ss+surplus*2);
    let sc;
    if(style==='sharp') sc=(p.vorp>0?p.vorp*useful:p.vorp)-(surplus>0?surplus*20:0)
                          +(need[p.p]>0?25:0)+(flex>0&&isFlexEligible(p.p)?10:0);
    else if(style==='needs'&&surplus>0) sc=(400-mr)-surplus*55;
    else sc=(400-mr)-(surplus>=1?surplus*38:0)+(style==='needs'?(need[p.p]>0?30:0):0);
    sc+=(Math.random()-0.5)*noise*(style==='sharp'?2.5:1);
    if(sc>bs){bs=sc;best=p;}
  }
  return best;
}

/* ---------- 6. RENDER ----------------------------------------- */
const $=s=>document.querySelector(s);
const byId=id=>scored.find(p=>p.id===id)||PLAYERS.find(p=>p.id===id);
/* FIX: single quotes were unescaped — safe only while every attribute uses
   double quotes, which is a rule a future edit could silently break. */
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamName=i=>S.teams[i]?S.teams[i].name:('Team '+(i+1));

function render(){
  if(!S){renderSetup();showView('Setup');return;}
  renderClock(); renderTabs();
  /* FIX: rebuilding ~260 rows twice a second during auto-sim is the main
     source of jank on a phone. While the bots run, only the clock moves;
     the full board is rebuilt the moment the sim hands back to you. */
  if(simming&&ui.auto) return;
  renderWatch(); renderBoard(); renderSugg();
  if(ui.view==='Team') renderMyTeam();
  if(ui.view==='Teams') renderTeams();
  if(ui.view==='Recap') renderRecapView();

}
function renderClock(){
  const n=nextPickNumber();
  if(n>totalPicks()){$('#clockRd').textContent='Done';$('#clockWho').textContent='Draft complete';return;}
  const t=teamOnPick(n), mine=t===S.myTeamIdx;
  $('#clockRd').textContent=`R${roundOf(n)}·${n}`;
  $('#clockWho').innerHTML=mine?`<span class="onclock">You are on the clock</span>`
    :`${esc(teamName(t))} picking`+(myNextPick(n)?` · you at ${myNextPick(n)}`:'');
}
function renderTabs(){
  const t=$('#posTabs');
  if(t.children.length) {
    [...t.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===ui.pos));return;
  }
  ['ALL',...POSITIONS].forEach(p=>{
    const b=document.createElement('button');
    b.className='tab';b.dataset.p=p;b.textContent=p;
    b.setAttribute('aria-pressed',p===ui.pos);

}
function visiblePlayers(){
  const drafted=draftedIds();
  let list=scored.slice();
  if(ui.pos!=='ALL') list=list.filter(p=>p.p===ui.pos);
  if(ui.q){const q=ui.q.toLowerCase();list=list.filter(p=>p.n.toLowerCase().includes(q));}
  if(ui.hide) list=list.filter(p=>!drafted.has(p.id));
  if(ui.steals){const n=nextPickNumber(), myTE=needsOf(S.myTeamIdx).cnt.TE;
    list=list.filter(p=>!drafted.has(p.id)&&p.vorp>0&&p.p!=='K'&&p.p!=='DST'
      &&!(p.p==='TE'&&myTE>=1)&&(n-p.ovr)>=12);}

  else if(ui.sort==='trusted') list.sort((a,b)=>(a.tr!=null?a.tr:999)-(b.tr!=null?b.tr:999));
  else list.sort((a,b)=>b.vorp-a.vorp);
  return list.slice(0,260);
}

function renderBoard(){
  const drafted=draftedIds(), list=visiblePlayers(), n=nextPickNumber();

  const maxV=Math.max(...list.map(p=>p.vorp),1);

      <span class="body">
        <span class="nm">${isWatched(p.id)?'<span class="starred">★</span> ':''}${esc(p.n)}${steal?' <span class="steal">◆</span>':''}${!gone&&hc.has(p.id)?' <span class="tagf tag-hc">HC</span>':''}${!gone&&stk.has(p.id)?' <span class="tagf tag-st">STACK</span>':''}</span>
        <span class="meta">${esc(p.t)}${p.b?' · bye '+p.b:''}
          ${p.r1!=null?` · ${esc(META.rank1abbr||'R1')}${p.r1}`:''}${p.r2!=null?` ${esc(META.rank2abbr||'R2')}${p.r2}`:''}${p.r3!=null?` ${esc(META.rank3abbr||'C')}${p.r3}`:''}
          ${steal?`· <span class="steal">+${bd} vs board</span>`:diff!=null?`· <span class="${diff>0?'up':'down'}">ADP ${diff>0?'+':''}${diff}</span>`:''}
          ${est?'<span class="est">est</span>':''}</span>
        <span class="gauge"><i style="width:${(g*100).toFixed(0)}%"></i></span>
      </span>
      <span class="fig">
        <span class="vorp num ${p.vorp>=0?'up':'down'}">${p.vorp>0?'+':''}${p.vorp.toFixed(0)}</span><br>
        <span class="sub num">${p.pts.total.toFixed(0)} pts</span>

/* ---------- 7. PICK SHEET ------------------------------------- */
function openSheet(id){
  /* compare mode: the second tap routes here from every entry point —
     board, watchlist, suggestions, grid — so intercept once. */
  if(ui.compareWith){
    if(ui.compareWith!==id){ const w=ui.compareWith; ui.compareWith=null; hideCmpBar(); openCompareSheet(w,id); return; }
    ui.compareWith=null; hideCmpBar();   // tapped the same player: cancel into his card
  }
  const p=byId(id); if(!p) return;
  ui.sheetFor=id;
  const drafted=draftedIds(), isGone=drafted.has(id);
  const pick=S.picks.find(x=>x.playerId===id);
  const n=nextPickNumber(), diff=p.a!=null?Math.round(n-p.a):null;
  const nxt=myNextPick(n+1);
  const av=scored.filter(x=>!drafted.has(x.id));
  const surv=nxt?Math.round(survival(p,survivalContext(av,n+1,nxt))*100):null;
  let h=`<div class="grab"></div>
    <h3>${esc(p.n)} <span class="pill">${p.p}${posRankMap[p.id]||''}</span></h3>
    <div class="sub2">${esc(p.t)||'FA'}${p.b?` · bye ${p.b}`:''}
      ${p.r1!=null?` · ${esc(META.rank1)} ${p.r1}`:''}${p.r2!=null?` · ${esc(META.rank2)} ${p.r2}`:''}${p.r3!=null?` · ${esc(META.rank3)} ${p.r3}`:''}</div>
    <div class="statline">
      <div><div class="k">VORP</div><div class="v ${p.vorp>=0?'up':'down'}">${p.vorp>0?'+':''}${p.vorp.toFixed(0)}</div></div>
      <div><div class="k">Points</div><div class="v">${p.pts.total.toFixed(0)}</div></div>
      <div><div class="k">${diff!=null?'ADP diff':'ADP'}</div><div class="v">${diff!=null?(diff>0?'+':'')+diff:'—'}</div></div>
    </div>`;
  const F=rosterFlags();
  if(F.hc.has(p.id)) h+=`<div class="hint"><span class="tagf tag-hc">HC</span> Shares a backfield with one of your backs — insurance if he goes down.</div>`;
  if(F.stk.has(p.id)) h+=`<div class="hint"><span class="tagf tag-st">STACK</span> Catches passes from your quarterback; their big weeks tend to arrive together.</div>`;
  const bl=byeLoad().find(b=>b.week===p.b);
  if(bl&&bl.n>=2) h+=`<div class="hint">You already have ${bl.n} starters off in week ${p.b}.</div>`;
  if(p.pts.bonusShare>0.05) h+=`<div class="hint">${Math.round(p.pts.bonusShare*100)}% of this total is modeled from per-game distributions, not exact.</div>`;
  if(p.p==='K'||p.p==='DST') h+=`<div class="hint">Scoring incomplete: no FG distance splits / per-game defensive brackets. Rank by published rank instead.</div>`;
  const bdS=Math.round(n-p.ovr);
  if(!isGone&&p.vorp>0&&bdS>=12&&p.p!=='K'&&p.p!=='DST'&&!(p.p==='TE'&&needsOf(S.myTeamIdx).cnt.TE>=1)){
    let st=`<div class="hint"><span class="steal">◆ Steal</span> — this league's scoring values him at pick ${p.ovr}; the room has passed him ${bdS} times since.`;
    /* the trusted pair corroborates or cautions, but never triggers: the flag
       is league math; Winks+Norris tell you whether the projections have news */
    const mkt=p.a!=null?p.a:p.r3;
    if(p.tr!=null&&mkt!=null){
      const edge=Math.round(mkt-p.tr);
      if(edge>=12) st+=` Winks and Norris agree — they rank him ${Math.round(p.tr)} against a market ${Math.round(mkt)}.`;
      else if(edge<=-12) st+=` One caution: Winks and Norris rank him just ${Math.round(p.tr)} — the projections may be missing news they have.`;
    }
    h+=st+`</div>`;
  }
  if(surv!=null&&!isGone) h+=`<div class="hint">About ${surv}% likely to survive to your next pick (${nxt}).</div>`;
  if(isGone){
    const after=pick?S.picks.length-S.picks.findIndex(x=>x.playerId===id)-1:0;
    h+=`<button class="act danger" data-a="undo">${after?`Rewind to pick ${pick.pickNumber}`:'Mark available again'}</button>
        <div class="hint">Taken at pick ${pick?pick.pickNumber:'?'} by ${pick?esc(teamName(pick.teamIdx)):'?'}.
        ${after?`Undoing him also removes the ${after} pick${after>1?'s':''} made after him — the draft rewinds to that point.`:''}</div>`;
  }else{
    h+=`<button class="act" data-a="watch">${isWatched(id)?'★ Remove from watchlist':'☆ Add to watchlist'}</button>
        <button class="act primary" data-a="me">Drafted by me</button>
        <div class="eyebrow" style="margin:12px 0 6px">Drafted by</div><div class="teamgrid">`;
    for(let i=0;i<S.numTeams;i++) if(i!==S.myTeamIdx)
      h+=`<button data-a="team" data-i="${i}">${esc(teamName(i))}</button>`;
    h+=`</div><button class="act" data-a="cmp">⚖ Compare with another player</button>
        <button class="act" data-a="skip">${S.skip.includes(id)?'Remove from':'Add to'} don't-suggest list</button>`;
  }
  $('#sheet').innerHTML=h;
  $('#sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='me') doPick(id,S.myTeamIdx);
    else if(a==='team') doPick(id,+b.dataset.i);
    else if(a==='undo') undoPlayer(id);
    else if(a==='watch'){ toggleWatch(id); closeSheet(); render(); }
    else if(a==='cmp'){ ui.compareWith=id; closeSheet(); showCmpBar(); }
    else if(a==='skip'){ const i=S.skip.indexOf(id);
      i>=0?S.skip.splice(i,1):S.skip.push(id); save(); closeSheet(); render(); }
  });
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}
const closeSheet=()=>{$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');ui.sheetFor=null;};
function showCmpBar(){
  let el=$('#cmpBar');
  if(!el){ el=document.createElement('div'); el.id='cmpBar'; document.body.appendChild(el); }
  const p=byId(ui.compareWith);
  el.innerHTML=`<span>Comparing <strong>${esc(p?p.n:'')}</strong> — tap another player</span><button id="cmpX" aria-label="Cancel compare">✕</button>`;
  el.classList.add('on');
  $('#cmpX').onclick=()=>{ui.compareWith=null;hideCmpBar();};
}
function hideCmpBar(){ const el=$('#cmpBar'); if(el) el.classList.remove('on'); }

/* ---------- 7b. HEAD-TO-HEAD SHEET ----------------------------- */
function openCompareSheet(idA,idB){
  const c=comparePlayers(idA,idB); if(!c) return;
  const {a,b,pa,pb,env}=c;
  const drafted=draftedIds(), goneA=drafted.has(a.id), goneB=drafted.has(b.id);
  const d=Math.round(pa.score-pb.score);
  const fmt=v=>v==null?'—':v;
  /* one row of the grid, better value highlighted; lowBetter for ranks */
  const row=(k,va,vb,lowBetter,fmtFn)=>{
    fmtFn=fmtFn||(x=>x==null?'—':x);
    let wa='',wb='';
    if(va!=null&&vb!=null&&va!==vb){
      const aWins=lowBetter?va<vb:va>vb;
      wa=aWins?' win':''; wb=aWins?'':' win';
    }
    return `<div class="k">${k}</div><div class="num${wa}">${fmtFn(va)}</div><div class="num${wb}">${fmtFn(vb)}</div>`;
  };
  let verdict;
  if(goneA||goneB){
    verdict=`${esc((goneA?a:b).n)} is already drafted — no plan to weigh.`;
  }else if(Math.abs(d)<4){
    verdict=`<strong>Coin flip.</strong> The two plans land within ${Math.max(1,Math.abs(d))} points of each other through your next pick. Take the one you believe in.`;
  }else{
    const w=d>0?a:b, l=d>0?b:a, lp=d>0?pb:pa;
    verdict=`Take <strong>${esc(w.n)}</strong> first — that plan projects <strong>+${Math.abs(d)} points</strong> through your next pick`;
    if(!drafted.has(l.id)&&lp.surv>=0.55) verdict+=`, and ${esc(l.n)} is ${Math.round(lp.surv*100)}% to still be there`;
    verdict+='.';
  }
  let h=`<div class="grab"></div>
    <h3>Head to head</h3>
    <div class="verdict">${verdict}</div>
    <div class="cmpgrid">
      <div></div>
      <div class="hd">${esc(a.n)}<br><span class="sub">${a.p}${posRankMap[a.id]||''} · ${esc(a.t)||'FA'}</span></div>
      <div class="hd">${esc(b.n)}<br><span class="sub">${b.p}${posRankMap[b.id]||''} · ${esc(b.t)||'FA'}</span></div>
      ${row('Plan',Math.round(pa.score),Math.round(pb.score),false)}
      ${row('VORP',Math.round(a.vorp),Math.round(b.vorp),false)}
      ${row('Points',Math.round(a.pts.total),Math.round(b.pts.total),false)}
      ${row('Our board',a.ovr,b.ovr,true)}
      ${row(esc(META.rank1),a.r1,b.r1,true)}
      ${row(esc(META.rank2),a.r2,b.r2,true)}
      ${row(esc(META.rank3),a.r3,b.r3,true)}
      ${row('ADP',a.a!=null?Math.round(a.a):null,b.a!=null?Math.round(b.a):null,true)}
      ${row('Survives',goneA?null:Math.round(pa.surv*100),goneB?null:Math.round(pb.surv*100),false,v=>v==null?'—':v+'%')}
      ${row('Bye',a.b||null,b.b||null,false,v=>v==null?'—':v)}
    </div>
    <div class="hint">Plan = points he adds now, plus the expected best pick still available at your next turn if you take him — the same math behind the suggestions.</div>`;
  if((a.p==='TE'||b.p==='TE')&&env.cnt.TE>=1)
    h+=`<div class="hint">You already carry a tight end — the engine would not spend this pick on another. Stream the position instead.</div>`;
  h+=`<button class="act" data-c="${a.id}">Open ${esc(a.n)}</button>
      <button class="act" data-c="${b.id}">Open ${esc(b.n)}</button>`;
  $('#sheet').innerHTML=h;
  $('#sheet').querySelectorAll('[data-c]').forEach(bt=>bt.onclick=()=>openSheet(bt.dataset.c));
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}

async function doPick(playerId,teamIdx,manualName){
  const n=nextPickNumber();
  if(n>totalPicks()) return;
  if(S.picks.some(p=>p.pickNumber===n)) return;   // FIX: dedupe was defined but never wired
  const pick={pickNumber:n,round:roundOf(n),teamIdx,playerId:playerId||null,
    manualName:manualName||null,timestamp:Date.now()};
  if(playerId&&S.picks.some(p=>p.playerId===playerId)) return;  // FIX: no double-drafting
  S.picks.push(pick);
  await storage.saveSession(S);
  closeSheet(); render();
  // auto-sim armed and that was your pick? carry on without asking
  if(ui.auto&&teamIdx===S.myTeamIdx&&nextPickNumber()<=totalPicks())
    setTimeout(runSim,450);
}
async function undoLast(){
  ui.auto=false; setSimLabel();
  if(!S.picks.length) return;
  S.picks.pop(); await storage.saveSession(S); render();
}
/* Pick order IS the state: picks[j] belongs to whoever the snake gives pick j+1.
   Removing a pick from the middle would shift every later pick into a different
   team's slot while it kept its old teamIdx, which silently corrupted the board.
   Undoing a drafted player therefore REWINDS to just before he was taken. */
async function undoPlayer(id){
  const i=S.picks.findIndex(p=>p.playerId===id);
  if(i<0) return;
  ui.auto=false; setSimLabel();
  S.picks.splice(i);
  await storage.saveSession(S); closeSheet(); render();
}
const save=()=>storage.saveSession(S);

/* ---------- 8. MOCK DRAFT ------------------------------------- */
let simming=false;
function setSimLabel(){
  const b=$('#simBtn'); if(!b) return;
  b.textContent=ui.auto?'■ Auto-sim on':'▶ Auto-sim';
  b.setAttribute('aria-pressed',ui.auto?'true':'false');
}
function toggleSim(){
  ui.auto=!ui.auto; setSimLabel();
  if(ui.auto) runSim();
}
async function runSim(){
  if(simming) return;
  simming=true;
  while(ui.auto){
    const n=nextPickNumber();
    if(n>totalPicks()){ui.auto=false;break;}
    if(teamOnPick(n)===S.myTeamIdx) break;     // your clock — hold, stay armed
    const idx=teamOnPick(n), p=botPick(idx);
    if(!p){ui.auto=false;break;}
    await doPick(p.id,idx);
    await new Promise(r=>setTimeout(r,500));
  }
  simming=false; setSimLabel(); render();
}

const flexOk=p=>['RB','WR','TE'].includes(p);
/* ---------- 8b. POST-DRAFT GRADES & RECAP ---------------------
   Everything here is computed locally from the same projections the
   board uses. Grades are RELATIVE to the other teams in this draft,
   because that is what actually decides a head-to-head season. */
function optimalLineup(idx){
  const r=rosterOf(idx).map(p=>byId(p.playerId)).filter(Boolean);
  const used=new Set(), starters=[];
  POSITIONS.forEach(pos=>{
    r.filter(x=>x.p===pos&&!used.has(x.id))
     .sort((a,b)=>b.pts.total-a.pts.total)
     .slice(0,S.rosterSlots[pos]||0)
     .forEach(x=>{starters.push({slot:pos,pl:x});used.add(x.id);});
  });
  for(let i=0;i<(S.rosterSlots.FLEX||0);i++){
    const f=r.filter(x=>flexOk(x.p)&&!used.has(x.id))
             .sort((a,b)=>b.pts.total-a.pts.total)[0];
    if(f){starters.push({slot:'FLEX',pl:f});used.add(f.id);}
  }
  const bench=r.filter(x=>!used.has(x.id)).sort((a,b)=>b.pts.total-a.pts.total);
  return {starters,bench,pts:starters.reduce((a,x)=>a+x.pl.pts.total,0)};
}
function leagueGrades(){
  const rows=[];
  for(let i=0;i<S.numTeams;i++) rows.push({idx:i,...optimalLineup(i)});
  [...rows].sort((a,b)=>b.pts-a.pts).forEach((r,i)=>r.rank=i+1);
  const n=Math.max(2,S.numTeams);
  rows.forEach(r=>{
    const q=(r.rank-1)/(n-1);
    r.grade=q<=0.05?'A+':q<=0.16?'A':q<=0.27?'A-':q<=0.41?'B+':q<=0.57?'B'
           :q<=0.69?'B-':q<=0.80?'C+':q<=0.90?'C':q<=0.97?'C-':'D';
  });
  return rows;
}
/* strongest and weakest position groups relative to the rest of the league */
function positionalEdge(idx,rows){
  const grp={};
  POSITIONS.forEach(pos=>{
    const mine=rows[idx].starters.filter(s=>s.pl.p===pos).reduce((a,s)=>a+s.pl.pts.total,0);
    const others=rows.filter(r=>r.idx!==idx)
      .map(r=>r.starters.filter(s=>s.pl.p===pos).reduce((a,s)=>a+s.pl.pts.total,0));
    const avg=others.length?others.reduce((a,b)=>a+b,0)/others.length:0;
    if(mine||avg) grp[pos]={mine,avg,diff:mine-avg};
  });
  return grp;
}
/* draft-day value, judged against OUR league-scored board. Beating the room's
   ADP proves nothing by itself — the market prices half-PPR, this league does
   not. A steal is a player taken after where these rules say he should go.
   The ADP gap rides along as context only. */
function pickValue(idx){
  return rosterOf(idx).map(p=>{
    const pl=byId(p.playerId); if(!pl||pl.p==='K'||pl.p==='DST') return null;
    return {pl,pick:p.pickNumber,delta:Math.round(p.pickNumber-pl.ovr),
            adp:pl.a!=null?Math.round(p.pickNumber-pl.a):null};
  }).filter(Boolean).sort((a,b)=>b.delta-a.delta);
}
/* if a starter goes down, how far does the roster fall at that position? */
function fragility(idx,L){
  const out=[];
  POSITIONS.forEach(pos=>{
    if(pos==='K'||pos==='DST') return;
    const st=L.starters.filter(s=>s.pl.p===pos).map(s=>s.pl);
    if(!st.length) return;
    const worst=st[st.length-1];
    const next=L.bench.filter(b=>b.p===pos)[0];
    out.push({pos,drop:next?Math.round(worst.pts.total-next.pts.total):Math.round(worst.pts.total),
              hasCover:!!next});
  });
  return out.sort((a,b)=>b.drop-a.drop);
}
function byeTrouble(L){
  const w={};
  L.starters.forEach(s=>{if(s.pl.b) (w[s.pl.b]=w[s.pl.b]||[]).push(s.pl.n);});
  return Object.entries(w).filter(([,v])=>v.length>=3)
    .map(([week,v])=>({week:+week,names:v}));
}
/* Weekly scoring across the fantasy regular season. A season total hides bye
   damage completely — this fills each week's lineup from whoever is actually
   playing, so a week with three starters off shows up as the dip it is. */
const REG_FROM=1, REG_TO=13;
function weeklyScores(idx,from,to){
  from=from||REG_FROM; to=to||REG_TO;
  const G=S.scoring.games||17;
  const r=rosterOf(idx).map(p=>byId(p.playerId)).filter(Boolean);
  const out=[];
  for(let w=from;w<=to;w++){
    const pool=r.filter(p=>p.b!==w);
    const used=new Set(); let pts=0; const gaps=[];
    POSITIONS.forEach(pos=>{
      const need=S.rosterSlots[pos]||0;
      const got=pool.filter(x=>x.p===pos&&!used.has(x.id))
                    .sort((a,b)=>b.pts.total-a.pts.total).slice(0,need);
      got.forEach(x=>{used.add(x.id);pts+=x.pts.total/G;});
      for(let k=got.length;k<need;k++) gaps.push(pos);
    });
    for(let i=0;i<(S.rosterSlots.FLEX||0);i++){
      const f=pool.filter(x=>flexOk(x.p)&&!used.has(x.id))
                  .sort((a,b)=>b.pts.total-a.pts.total)[0];
      if(f){used.add(f.id);pts+=f.pts.total/G;} else gaps.push('FLEX');
    }
    out.push({week:w,pts,holes:gaps.length,gaps});
  }
  return out;
}
function weeklySummary(idx){
  const w=weeklyScores(idx);
  const vals=w.map(x=>x.pts);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const lo=w.reduce((a,b)=>b.pts<a.pts?b:a), hi=w.reduce((a,b)=>b.pts>a.pts?b:a);
  return {weeks:w,mean,total:vals.reduce((a,b)=>a+b,0),lo,hi,
          holes:w.reduce((a,b)=>a+b.holes,0)};
}

  const frag=fragility(S.myTeamIdx,me);
  const byes=byeTrouble(me);
  const lg=rows.map(r=>r.pts), avg=lg.reduce((a,b)=>a+b,0)/lg.length;
  const best=Object.entries(edge).filter(([p])=>p!=='K'&&p!=='DST')
    .sort((a,b)=>b[1].diff-a[1].diff);

      · ${me.pts>avg?'+':''}${(me.pts-avg).toFixed(0)} vs league average</div></div>
    </div>`;
  if(!done) h+=`<div class="hint">Draft isn't finished — this updates as picks come in.</div>`;

  h+=`<div class="card"><h3>Weeks 1–13</h3>
    <div class="gradewrap">
      <div><div class="num" style="font-size:28px;font-weight:800;letter-spacing:-.03em">${wk.mean.toFixed(1)}</div>

      <div class="sub2" style="margin:0">${wk.total.toFixed(0)} total over 13 weeks<br>

    </div>
    <div class="byestrip" style="margin-top:10px">`+
    wk.weeks.map(x=>`<div class="byecol">
      <div class="byebar ${x.holes?'bad':x.pts<wk.mean*0.93?'warn2':''}"

      <div class="byewk num">${x.week}</div></div>`).join('')+

        wk.weeks.filter(x=>x.gaps.length).map(x=>`week ${x.week} (no ${[...new Set(x.gaps)].join(', ')})`).join(', ')
        }. You'll be streaming from waivers those weeks.</span>`:'Every slot is covered on every bye week.'}

  const ORDER={QB:0,RB:1,WR:2,TE:3,FLEX:4,K:5,DST:6};
  h+=`<div class="card"><h3>Your starting lineup</h3>`;
  [...me.starters].sort((a,b)=>ORDER[a.slot]-ORDER[b.slot]).forEach(st=>
    h+=`<div class="slot"><span><span class="badge b-${st.pl.p}" style="display:inline-grid;vertical-align:-5px;margin-right:8px">${st.slot==='FLEX'?'FLX':st.pl.p}</span>${esc(st.pl.n)}
      ${st.pl.b?`<span class="sub">bye ${st.pl.b}</span>`:''}</span>
      <span class="num">${st.pl.pts.total.toFixed(0)}</span></div>`);
  if(me.bench.length) h+=`<div class="hint">Bench: ${esc(me.bench.slice(0,8).map(b=>b.n).join(', '))}</div>`;
  h+=`</div>`;

  h+=`<div class="card"><h3>Where you stand</h3>`;
  if(best.length){
    const s=best[0], w=best[best.length-1];
    h+=`<div class="slot"><span><strong>${s[0]}</strong> is your strength</span>
      <span class="num up">${s[1].diff>0?'+':''}${s[1].diff.toFixed(0)}</span></div>`;
    h+=`<div class="slot"><span><strong>${w[0]}</strong> is your weak spot</span>
      <span class="num ${w[1].diff>=0?'up':'down'}">${w[1].diff>0?'+':''}${w[1].diff.toFixed(0)}</span></div>`;

  }

  h+=`<div class="card"><h3>League table</h3>`;
  [...rows].sort((a,b)=>a.rank-b.rank).forEach(r=>
    h+=`<div class="slot"><span><span class="idx num" style="margin-right:8px">${r.rank}</span>

  return h;
}

/* ---------- 8c. WATCHLIST, FLAGS, GRID, BYES, EXPORT ----------- */
const isWatched=id=>(S.watch||[]).includes(id);
function toggleWatch(id){
  if(!S.watch) S.watch=[];
  const i=S.watch.indexOf(id);
  i>=0?S.watch.splice(i,1):S.watch.push(id);
  save();

/* Handcuffs and stacks fall straight out of the team field.
   A handcuff shares a backfield with one of your backs; a stack shares
   a quarterback with you, so their good weeks arrive together. */
function rosterFlags(){
  const mine=rosterOf(S.myTeamIdx).map(p=>byId(p.playerId)).filter(Boolean);
  const myRB=mine.filter(p=>p.p==='RB'&&p.t), myQB=mine.filter(p=>p.p==='QB'&&p.t);
  const hc=new Set(), stk=new Set();
  scored.forEach(p=>{
    if(!p.t) return;
    if(p.p==='RB'&&myRB.some(r=>r.t===p.t&&r.id!==p.id)) hc.add(p.id);
    if((p.p==='WR'||p.p==='TE')&&myQB.some(q=>q.t===p.t)) stk.add(p.id);
  });
  return {hc,stk};
}
/* Bye load across your projected starters, so you catch a pileup in
   round 8 rather than reading about it in the recap. */
function byeLoad(){
  const L=optimalLineup(S.myTeamIdx), c={};
  L.starters.forEach(s=>{if(s.pl.b) c[s.pl.b]=(c[s.pl.b]||0)+1;});
  const weeks=Object.keys(c).map(Number);
  const lo=weeks.length?Math.min(5,...weeks):5, hi=weeks.length?Math.max(14,...weeks):14;
  const out=[]; for(let w=lo;w<=hi;w++) out.push({week:w,n:c[w]||0});
  return out;
}
function gridMap(){
  const byPick={};
  S.picks.forEach(p=>byPick[p.pickNumber]=p);
  const rounds=[];
  for(let r=1;r<=totalRounds();r++){
    const cells=[];
    for(let c=0;c<S.numTeams;c++){
      // find the pick number in this round belonging to team column c
      let num=null;
      for(let k=(r-1)*S.numTeams+1;k<=r*S.numTeams;k++)
        if(teamOnPick(k)===c){num=k;break;}
      cells.push({num,pick:byPick[num]||null});
    }
    rounds.push({round:r,cells});
  }
  return rounds;
}
function exportText(){
  const rows=leagueGrades(), me=rows[S.myTeamIdx];
  const L=me, nm=p=>p?p.n:'?';
  let t=`${S.sessionName||'Draft'} — ${S.numTeams} teams, ${totalRounds()} rounds\n`;
  t+=`${'='.repeat(46)}\n\n`;
  const wk=weeklySummary(S.myTeamIdx);
  t+=`${teamName(S.myTeamIdx)} — grade ${me.grade}\n`;
  t+=`${me.pts.toFixed(0)} projected starting points (${me.rank} of ${S.numTeams})\n`;
  t+=`${wk.mean.toFixed(1)} pts/week over weeks 1-13 (${wk.total.toFixed(0)} total)\n`;
  t+=`worst week: ${wk.lo.week} at ${wk.lo.pts.toFixed(1)}\n`;
  const gapw=wk.weeks.filter(x=>x.gaps.length);
  if(gapw.length) t+=`bye holes: ${gapw.map(x=>`wk${x.week} no ${[...new Set(x.gaps)].join('/')}`).join(', ')}\n`;
  t+=`\nSTARTERS\n`;
  const ORD={QB:0,RB:1,WR:2,TE:3,FLEX:4,K:5,DST:6};
  [...L.starters].sort((a,b)=>ORD[a.slot]-ORD[b.slot]).forEach(st=>
    t+=`  ${(st.slot==='FLEX'?'FLX':st.slot).padEnd(4)} ${nm(st.pl).padEnd(24)} ${st.pl.pts.total.toFixed(0).padStart(5)}\n`);
  if(L.bench.length){ t+=`\nBENCH\n`;
    L.bench.forEach(b=>t+=`  ${b.p.padEnd(4)} ${nm(b).padEnd(24)} ${b.pts.total.toFixed(0).padStart(5)}\n`); }
  t+=`\nLEAGUE\n`;
  [...rows].sort((a,b)=>a.rank-b.rank).forEach(r=>
    t+=`  ${String(r.rank).padStart(2)}. ${r.grade.padEnd(3)} ${teamName(r.idx).padEnd(16)} ${r.pts.toFixed(0)}\n`);
  t+=`\nFULL DRAFT\n`;
  S.picks.forEach(p=>{const pl=byId(p.playerId);
    t+=`  ${String(p.pickNumber).padStart(3)}  ${teamName(p.teamIdx).padEnd(16)} ${(pl?pl.n:p.manualName||'?').padEnd(24)} ${pl?pl.p:''}\n`;});
  t+=`\nProjections are consensus; kicker and defense totals are incomplete.\n`;
  return t;
}
async function copyExport(btn){
  const t=exportText();

  catch(e){
