  const v=$('#viewRecap');
  if(!S.picks.length){
    v.innerHTML='<div class="empty-state">No picks yet. Grades appear once the draft is under way.</div>';
    return;
  }
  v.innerHTML=renderRecap();
  const e=$('#expBtn'); if(e) e.onclick=()=>copyExport(e);
}
const SUFFIX=/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i;
function shortName(p){
  if(!p) return '';
  const n=p.n.replace(SUFFIX,'').trim().split(/\s+/);
  return n[n.length-1];
}
function renderGrid(){
  const rounds=gridMap();
  let h=`<div class="gridscroll"><table class="dgrid"><thead><tr><th class="rh"></th>`;
  for(let c=0;c<S.numTeams;c++)
    h+=`<th class="${c===S.myTeamIdx?'me':''}">${c===S.myTeamIdx?'YOU':esc(teamName(c)).slice(0,9)}</th>`;
  h+=`</tr></thead><tbody>`;
  rounds.forEach(r=>{
    h+=`<tr><td class="rh num">${r.round}</td>`;
    r.cells.forEach((c,ci)=>{
      const pl=c.pick?byId(c.pick.playerId):null;
      const nm=pl?shortName(pl):(c.pick&&c.pick.manualName?c.pick.manualName:'');
      h+=`<td class="${ci===S.myTeamIdx?'me':''}">${c.pick
        ? `<span class="gp gp-${pl?pl.p:'K'}">${esc(nm)}</span><span class="gn num">${c.num}</span>`
        : `<span class="gn num dim">${c.num}</span>`}</td>`;
    });
    h+=`</tr>`;
  });
  return h+`</tbody></table></div><div class="hint">Snake order — even rounds run right to left. Scroll sideways for the full board.</div>`;
}
function renderTeams(){
  const v=$('#viewTeams');
  const grades=S.picks.length?leagueGrades():null;
  let h=`<div class="toggles" style="padding:0 0 10px">
    <button class="tg" id="tabGrid" aria-pressed="${ui.league==='grid'}">Draft board</button>
    <button class="tg" id="tabRost" aria-pressed="${ui.league!=='grid'}">Rosters</button></div>`;
  if(ui.league==='grid'){
    v.innerHTML=h+(S.picks.length?renderGrid():'<div class="empty-state">No picks yet.</div>');
    $('#tabGrid').onclick=()=>{ui.league='grid';renderTeams();};
    $('#tabRost').onclick=()=>{ui.league='rosters';renderTeams();};
    return;
  }
  for(let i=0;i<S.numTeams;i++){
    const r=rosterOf(i);
    const {need}=needsOf(i);
    const g=grades?grades[i]:null;
    h+=`<div class="card"><h3>${esc(teamName(i))}${i===S.myTeamIdx?' <span class="pill pilllive">you</span>':''}
      ${S.botStyles[i]&&i!==S.myTeamIdx?`<span class="pill">${S.botStyles[i]}</span>`:''}
      ${g?`<span class="gradesm">${g.grade}</span> <span class="sub num">${g.pts.toFixed(0)}</span>`:''}</h3>`;
    if(!r.length) h+=`<span class="sub2">No picks yet</span>`;
    r.forEach(p=>{const pl=byId(p.playerId);
      h+=`<div class="slot"><span><span class="idx num" style="margin-right:8px">${p.pickNumber}</span>${esc(pl?pl.n:p.manualName||'?')}</span>
        <span class="sub num">${pl?pl.p:''}</span></div>`;});
    if(nd) h+=`<div style="margin-top:8px">${POSITIONS.filter(p=>need[p]>0).map(p=>`<span class="need">${p} ×${need[p]}</span>`).join('')}</div>`;
    h+=`</div>`;
  }
  v.innerHTML=h;
  $('#tabGrid').onclick=()=>{ui.league='grid';renderTeams();};
  $('#tabRost').onclick=()=>{ui.league='rosters';renderTeams();};
}

/* ---------- 10. SETUP ----------------------------------------- */
async function renderSetup(){
  const v=$('#viewSetup');
  const sessions=await storage.listSessions();
  const st=S||{sessionName:'',numTeams:12,myTeamIdx:0,rosterSlots:{...DEFAULT_ROSTER},
    scoring:{...DEFAULT_SCORING},teams:[]};
  const locked=!!(S&&S.picks.length);
  const dis=locked?' disabled':'';
  let h=`<div class="card"><h3>${S?'This draft':'New draft'}</h3>
    ${locked?`<div class="hint">League size and lineup slots are locked — ${S.picks.length} pick${S.picks.length>1?'s':''} already reference this shape. Reset picks to change them.</div>`:''}
    <label class="f"><span>League name</span><input id="sName" value="${esc(st.sessionName||'')}" placeholder="My league"></label>
    <div class="fgrid">
      <label class="f"><span>Teams</span><input id="sTeams" type="number" min="2" max="20" value="${st.numTeams}"${dis}></label>
      <label class="f"><span>My draft slot</span><input id="sSlot" type="number" min="1" max="${st.numTeams}" value="${(st.myTeamIdx||0)+1}"></label>
    </div>
    <div class="eyebrow" style="margin-bottom:6px">Starting lineup</div>
    <div class="fgrid3">`;
  ['QB','RB','WR','TE','FLEX','K','DST','BENCH'].forEach(k=>
    h+=`<label class="f"><span>${k}</span><input id="r_${k}" type="number" min="0" max="12" value="${st.rosterSlots[k]}"${dis}></label>`);
  h+=`</div>
    <div class="eyebrow" style="margin-bottom:6px">Scoring</div>
    <div class="fgrid">`;
  [['passYds','Pass yd'],['passTD','Pass TD'],['passInt','INT'],['rushYds','Rush yd'],
   ['rushTD','Rush TD'],['recYds','Rec yd'],['recPer5','Per 5 rec'],['recTD','Rec TD'],
   ['passGame300','300yd pass'],['passGame400','400yd pass'],['rushGame100','100yd rush'],
   ['rushGame200','200yd rush'],['recGame100','100yd rec'],['recGame200','200yd rec'],
   ['fumbleLost','Fumble lost']].forEach(([k,l])=>
    h+=`<label class="f"><span>${l}</span><input id="sc_${k}" type="number" step="0.01" value="${st.scoring[k]}"></label>`);
  h+=`</div>
    <div class="hint">Reception points apply per game in blocks of five — four catches score nothing. Changing any value re-ranks the board immediately.</div>
    <div class="eyebrow" style="margin-bottom:6px">Team names</div>
    <div id="teamNames"></div>
    <button class="act primary" id="saveBtn">${S?'Save settings':'Start draft'}</button>
    ${S?'<button class="act" id="mockBtn">Reset picks (keep settings)</button>':''}
  </div>`;
  if(sessions.length){
    h+=`<div class="card"><h3>Saved drafts</h3>`;
    sessions.forEach(s=>h+=`<div class="slot"><button data-open="${s.sessionId}" style="text-align:left;flex:1">
      ${esc(s.sessionName||'Untitled')} <span class="sub">· ${s.picks.length} picks</span></button>
      <button data-del="${s.sessionId}" class="tg">Delete</button></div>`);
    h+=`</div>`;
  }
  if(S&&S.dataStamp&&S.dataStamp!==META.stamp)
    h+=`<div class="card"><h3>Data changed</h3><div class="warn" style="margin:0">
      This draft was created against ${esc(S.dataStamp)}; the app now carries ${esc(META.stamp)}.
      Projections and ranks shown for it will differ from what you saw on the night.</div></div>`;
  // built up first — nesting ternaries inside template literals is unreadable
  // and one unclosed backtick silently swallows the rest of the string
  const srcBits=[`<strong>${esc(META.proj)}</strong> for projections`];
  if(META.adp) srcBits.push(`<strong>${esc(META.adp)}</strong> for ADP`);
  if(hasR1||hasR2||hasR3){
    const rl=[];
    if(hasR1) rl.push(`<strong>${esc(META.rank1)}</strong>`);
    if(hasR2) rl.push(`<strong>${esc(META.rank2)}</strong>`);
    if(hasR3) rl.push(`<strong>${esc(META.rank3)}</strong>`);
    srcBits.push(rl.join(', ')+' for ranks');
  }
  h+=`<div class="card"><h3>Version</h3><div class="hint">Gridiron Marauder, build ${BUILD}. ${esc(META.stamp)}.</div></div>`;
  h+=`<div class="card"><h3>About the numbers</h3>
    <div class="hint">${srcBits.join(', ')}. ${esc(META.stamp)}.<br><br>VORP compares each player to the last starter at his position, using this league's size and lineup. FLEX is resolved by pooling spare RB/WR/TE, not assumed.<br><br>
    Totals marked <span class="est">est</span> lean on modeled per-game distributions. Kickers and defenses can't be scored properly yet: the projections lack field-goal distance splits and per-game points-allowed brackets.<br><br>
    Rankings are locked into a draft when it's created, so old drafts stay coherent.</div></div>`;
  v.innerHTML=h;
  const nt=+$('#sTeams').value;
  const tn=$('#teamNames');
  const drawNames=()=>{const c=+$('#sTeams').value;tn.innerHTML='';
    for(let i=0;i<c;i++){const d=document.createElement('label');d.className='f';
      d.innerHTML=`<span>Team ${i+1}</span><input id="tn_${i}" value="${esc(st.teams&&st.teams[i]?st.teams[i].name:'Team '+(i+1))}">`;
      tn.appendChild(d);}};
  drawNames(); $('#sTeams').oninput=drawNames;
  $('#saveBtn').onclick=startOrSave;
  if($('#mockBtn')) $('#mockBtn').onclick=async()=>{
    S.picks=[]; S.watch=[]; ui.auto=false;
    await save();
    ['viewTeams','viewRecap','viewTeam'].forEach(v=>{const el=$('#'+v); if(el) el.innerHTML='';});
    setSimLabel(); ui.view='Board'; showView('Board'); render();
  };
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    S=await storage.loadSession(b.dataset.open); rescoreAll(); ui.view='Board'; showView('Board'); render();});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;
    await storage.deleteSession(id);
    if(S&&S.sessionId===id){          // FIX: was left dangling and resurrected on next save
      S=null; ui.auto=false; scored=[];
      ['viewBoard','viewTeam','viewTeams','viewRecap'].forEach(v2=>{
        const el=$('#'+v2); if(el) el.innerHTML='';});
    }
    renderSetup();});
}
async function startOrSave(){
  const locked=!!(S&&S.picks.length);            // FIX: structure is frozen once picks exist
  const nt=locked?S.numTeams:int($('#sTeams')&&$('#sTeams').value,12,2,20);
  const slot=int($('#sSlot')&&$('#sSlot').value,1,1,nt);
  const rosterSlots=locked?{...S.rosterSlots}:{};
  if(!locked) ['QB','RB','WR','TE','FLEX','K','DST','BENCH'].forEach(k=>
    rosterSlots[k]=int($('#r_'+k)&&$('#r_'+k).value,DEFAULT_ROSTER[k],0,12));
  const startSlots=['QB','RB','WR','TE','FLEX','K','DST']
    .reduce((a,k)=>a+(rosterSlots[k]||0),0);
  if(startSlots<1){ alert('A lineup needs at least one starting slot.'); return; }
  const scoring={...DEFAULT_SCORING};
  Object.keys(DEFAULT_SCORING).forEach(k=>{const el=$('#sc_'+k);
    if(el) scoring[k]=num(el.value,DEFAULT_SCORING[k]);});   // FIX: NaN -> default
  const teams=[];for(let i=0;i<nt;i++)teams.push({teamIdx:i,name:($('#tn_'+i)?$('#tn_'+i).value:'')||('Team '+(i+1))});
  if(!S){
    const styles={};for(let i=0;i<nt;i++) styles[i]=STYLES[Math.floor(Math.random()*STYLES.length)];
    S={sessionId:'s'+Date.now(),sessionName:$('#sName').value||'My league',createdAt:Date.now(),
       dataStamp:META.stamp,          // remember which dataset this draft was built on
       numTeams:nt,teams,myTeamIdx:slot-1,rosterSlots,scoring,picks:[],skip:[],watch:[],botStyles:styles};
  }else{
    Object.assign(S,{sessionName:$('#sName').value||S.sessionName,numTeams:nt,teams,
      myTeamIdx:slot-1,rosterSlots,scoring});
    for(let i=0;i<nt;i++) if(!S.botStyles[i]) S.botStyles[i]=STYLES[Math.floor(Math.random()*STYLES.length)];
  }
  await storage.saveSession(S);
  rescoreAll(); ui.view='Board'; showView('Board'); render();
}

/* ---------- 11. WIRING ---------------------------------------- */
function showView(v){
  ui.view=v;
  ['Board','Team','Teams','Recap','Setup'].forEach(x=>
    $('#view'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('nav button').forEach(b=>
    b.setAttribute('aria-pressed',b.dataset.view===v));
  $('#searchRow').classList.toggle('hidden',v!=='Board');
  $('#posTabs').classList.toggle('hidden',v!=='Board');
  document.querySelector('.toggles').classList.toggle('hidden',v!=='Board');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  showView(b.dataset.view);
  if(b.dataset.view==='Team') renderMyTeam();
  if(b.dataset.view==='Teams') renderTeams();
  if(b.dataset.view==='Recap') renderRecapView();
  if(b.dataset.view==='Setup') renderSetup();
});
$('#q').oninput=e=>{ui.q=e.target.value;renderBoard();};
$('#tgHide').onclick=e=>{ui.hide=!ui.hide;e.target.setAttribute('aria-pressed',ui.hide);renderBoard();};
$('#tgSteal').onclick=e=>{ui.steals=!ui.steals;e.target.setAttribute('aria-pressed',ui.steals);renderBoard();};
$('#tgSort').onclick=e=>{
  ui.sort=ui.sort==='vorp'?'adp':(ui.sort==='adp'&&hasTrusted)?'trusted':'vorp';
  e.target.textContent='Sort: '+({vorp:'VORP',adp:'ADP',trusted:META.trustedAbbr||'Experts'})[ui.sort];
  renderBoard();};
$('#undoBtn').onclick=undoLast;
$('#simBtn').onclick=toggleSim;
$('#scrim').onclick=closeSheet;
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':cur==='dark'?'':'light';
  if(next) document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
};
window.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet();});

/* Pull down on the sheet to dismiss it. Without this the gesture escapes to
   the page and Chrome treats it as pull-to-refresh. */
(function(){
  const sh=$('#sheet'); if(!sh) return;
  let y0=0, dy=0, dragging=false;
  sh.addEventListener('touchstart',e=>{
    if(sh.scrollTop>0||e.touches.length!==1) return;
    y0=e.touches[0].clientY; dy=0; dragging=true;
    sh.style.transition='none';
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!dragging) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0){ sh.style.transform=''; return; }      // scrolling up: hand it back
    if(sh.scrollTop>0){ dragging=false; sh.style.transform=''; return; }
    sh.style.transform=`translateY(${dy}px)`;
    $('#scrim').style.opacity=String(Math.max(0,1-dy/420));
    if(e.cancelable) e.preventDefault();             // and no page refresh
  },{passive:false});
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    sh.style.transition=''; sh.style.transform='';
    $('#scrim').style.opacity='';
    if(dy>90) closeSheet();
  };
  sh.addEventListener('touchend',end);
  sh.addEventListener('touchcancel',end);
})();

(async function init(){
  const vc=$('#verChip'); if(vc) vc.textContent='v'+BUILD;   // single source of truth
  const list=await storage.listSessions();
  if(list.length){ S=list[0]; if(!S.skip)S.skip=[]; if(!S.botStyles)S.botStyles={}; if(!S.watch)S.watch=[];
    rescoreAll(); showView('Board'); render(); }
  else { renderSetup(); showView('Setup'); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
